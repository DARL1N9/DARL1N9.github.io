<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* [1. 전체 레이아웃 스타일 - 화사한 화이트 테마] */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f6f7;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #111111;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            width: 100%;
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        input[type="file"] {
            background-color: #f8f9fa;
            cursor: pointer;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            border: 1px solid #dddddd;
            border-radius: 4px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 공통 스타일: 텍스트 박스 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: inherit;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 스타일: 이미지 박스 */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
        }
        .image-box.placeholder::before {
            content: '클릭하여 이미지 업로드';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }

        /* ==================== 좌표 기반 배치 및 커스텀 스타일 ==================== */
        
        /* 좌측 상단 이름 영역: 원형 심볼 및 수정 가능한 이름 인풋 */
        .header-name-zone {
            position: absolute;
            left: 45px;
            top: 35px;
            display: flex;
            align-items: center;
        }
        .name-circle-symbol {
            font-size: 24px;
            font-weight: 900;
            background-color: #000000;
            color: #ffffff;
            width: 38px; height: 38px;
            border-radius: 50%;
            text-align: center;
            line-height: 38px;
            margin-right: 12px;
            letter-spacing: 1px;
        }
        .name-main-input {
            font-size: 18px;
            color: #222222;
            border: none;
            background: none;
            font-weight: bold;
            width: 250px;
        }

        /* SKIN / EYES / HAIR 컬러 그룹 및 픽커 스타일 */
        .color-group {
            position: absolute; 
            left: 45px; 
            top: 132px;
            width: 285px; 
            display: flex; 
            gap: 7px;
        }
        .color-item-wrapper {
            position: relative; 
            width: 90px; 
            height: 60px;
            border: 1px solid #000000; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-sizing: border-box;
        }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-label {
            font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444;
        }

        /* 좌측 키워드 3개: 각각 배경색 변경 가능하도록 픽커 추가 */
        .keyword-group {
            position: absolute;
            left: 45px;
            top: 98px;
            width: 285px;
            display: flex;
            gap: 7px;
        }
        .keyword-box-wrapper {
            position: relative;
            width: 90px;
            height: 26px;
            border: 1px solid #000000;
            background-color: #444; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }
        .keyword-box-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            z-index: 2;
        }
        .keyword-bg-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* 안내 문구 및 기타 요소 고정 좌표 */
        .info-text { position: absolute; left: 45px; top: 198px; font-size: 9px; color: #666; }
        .stat-input { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; text-align: center; font-weight: bold; }
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; }

        .bottom-desc-group { position: absolute; left: 45px; top: 395px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; }

        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }
        .mini-img-group { position: absolute; left: 355px; top: 395px; width: 280px; display: flex; justify-content: space-between; }
        .mini-img-box { width: 134px; height: 110px; }
        
        /* 배지 레이아웃 꼬임 방지 고정 */
        .mini-badge { position: absolute; top: -5px; left: 8px; background-color: #fff; border: 1px dashed #000; border-radius: 10px; font-size: 9px; padding: 1px 6px; z-index: 3; font-weight: bold; }
        .mini-badge-input { border: none; background: transparent; font-size: 9px; font-weight: bold; width: 75px; text-align: center; font-family: inherit; }

        .cloth-badge { position: absolute; top: 25px; left: 670px; background-color: #fff; border: 1px dashed #000; border-radius: 50%; width: 34px; height: 34px; text-align: center; line-height: 34px; font-size: 10px; font-weight: bold; z-index: 3; }
        .cloth-img-box { position: absolute; left: 660px; top: 35px; width: 295px; height: 375px; z-index: 1; }
        .cloth-desc-box { position: absolute; left: 660px; top: 425px; width: 295px; height: 80px; background-color: #F5F5F5; }

        .credit-line { position: absolute; left: 45px; bottom: 12px; width: 910px; display: flex; justify-content: space-between; font-size: 9px; color: #999; font-weight: bold; }

        .bottom-action-panel { margin-top: 30px; margin-bottom: 50px; text-align: center; width: 1000px; }
        #downloadBtn { background-color: #007bff; color: white; font-weight: bold; padding: 14px 35px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); }

        /* ==================== [수정] 팝업창 및 X 버튼 절대 레이어 제어 ==================== */
        .popup-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(92, 75, 81, 0.4); backdrop-filter: blur(3px); 
            display: flex; justify-content: center; align-items: center; z-index: 9999; 
        }
        .popup-content { 
            background-color: #ffffff; width: 90%; max-width: 420px; 
            padding: 40px 25px 30px 25px; border-radius: 16px; 
            text-align: center; border: 1px solid #FFE3E5; 
            position: relative; box-sizing: border-box;
        }
        /* [핵심 수정] 닫기 버튼이 무조건 최상단 우측에 깔끔히 고정되도록 재배치 */
        .popup-close-btn { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            background: none; 
            border: none; 
            font-size: 28px; 
            cursor: pointer; 
            color: #bbb; 
            line-height: 1;
            z-index: 10005; /* 컴포넌트 뭉침 현상 방지 최상단 우선권 */
            padding: 0;
        }
        .popup-close-btn:hover { color: #007bff; }
        .popup-badge { background-color: #007bff; color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; }
        .popup-body a { color: #007bff; text-decoration: none; font-weight: bold; }
        .popup-sub-text {
            font-size: 12px; color: #7A6B70; background-color: #FFF8F8;
            padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left;
            line-height: 1.6; border: 1px dashed #FFD1D5;
        }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 자료틀 메이커🍩</h2>
                <p>트위터
