<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 페어틀 메이커 - DARL1N9__</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* [1. 기본 디자인 - 파스텔 모드] */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #FFF5F5; /* 파스텔 핑크 베이지 */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        /* 트위터 링크 스타일 꾸미기 */
.twitter-link {
    color: #FF8E99; /* 파스텔 핑크색으로 통일 */
    text-decoration: none; /* 기본 밑줄 제거 */
    font-weight: bold;
    transition: color 0.2s;
}

.twitter-link:hover {
    color: #FFA3B1; /* 마우스 올렸을 때 살짝 더 연한 핑크로 변경 */
    text-decoration: underline; /* 마우스 올렸을 때만 밑줄 표시 */
}
        h1 {
            font-size: 20px;
            color: #5C4B51;
            margin-bottom: 20px;
        }
        
        /* [2. 컨트롤러 및 팝업 스타일] */
        .control-panel {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(255, 142, 153, 0.1);
            border: 1px solid #FFE3E5;
            margin-bottom: 20px;
            text-align: center;
        }
        .control-panel label { font-size: 13px; font-weight: bold; color: #7D6B72; }
        .control-panel input {
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1.5px solid #E2D9F3; /* 파스텔 라벤더 */
            width: 90%;
        }
        button {
            background-color: #FF8E99; /* 딸기우유색 */
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(255, 142, 153, 0.2);
        }
        button:hover { background-color: #FFA3B1; }

        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(92, 75, 81, 0.4);
            backdrop-filter: blur(2px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .popup-content {
            background-color: #ffffff;
            color: #4A4A4A;
            width: 90%; max-width: 420px;
            padding: 30px 20px 20px 20px;
            border-radius: 16px;
            position: relative; text-align: center;
            border: 1px solid #FFE3E5;
        }
        .popup-close-btn {
            position: absolute; top: 10px; right: 15px;
            background: none; border: none; color: #BBB;
            font-size: 28px; cursor: pointer;
        }
        .popup-badge { background-color: #FF8E99; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 15px; }
        .popup-body h2 { font-size: 18px; margin: 15px 0 10px 0; color: #5C4B51; }
        .popup-body p { font-size: 13px; color: #666; margin: 0 0 5px 0; }
        .popup-sub-text {
            font-size: 11px; color: #7A6B70;
            background-color: #FFF8F8;
            padding: 10px; border-radius: 6px; margin-top: 15px; text-align: left;
            border: 1px dashed #FFD1D5;
        }

        /* [3. 메인 틀 (시안 image_2.png 구현)] */
        .capture-area {
            width: 1000px; /* 시안 해상도 기준 */
            height: 563px;
            background-color: white;
            border: 1px solid #E5E5E5;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            color: black;
        }

        /* 그리드 및 컴포넌트 위치 지정 */
        .header { display: flex; align-items: center; justify-content: space-between; height: 50px; }
        .grid-left { position: absolute; left: 20px; top: 100px; width: 330px; display: flex; flex-direction: column; gap: 15px; }
        .grid-right { position: absolute; left: 660px; top: 20px; width: 320px; display: flex; flex-direction: column; gap: 15px; }

        /* 공통 스타일: 텍스트 상자 */
        .input-box { border: 1px solid black; background-color: #F0F0F0; font-size: 11px; padding: 10px; box-sizing: border-box; }
        
        /* 공통 스타일: 이미지 업로드 상자 */
        .image-box {
            border: 1.5px solid black;
            background-color: white;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .image-box.placeholder::before {
            content: '클릭하여 이미지 업로드';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #888;
            text-align: center;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }

        /* [컴포넌트 개별 스타일] */
        .header-left { display: flex; align-items: center; }
        .name-main { font-size: 24px; font-weight: bold; background-color: black; color: white; padding: 5px 15px; margin-right: 15px; }
        .name-sub { font-size: 16px; color: #888; border: none; background: none; }

        .keyword-row { display: flex; gap: 10px; }
        .keyword-box { flex: 1; text-align: center; padding: 5px 0; font-size: 10px; font-weight: bold; }

        .color-row { display: flex; gap: 10px; }
        .color-item { flex: 1; border: 1px solid black; background-color: #F0F0F0; text-align: center; padding: 20px 0; font-size: 10px; }
        
        .stat-input {
            width: 100%;
            border: 1.5px solid black;
            font-size: 12px;
            padding: 5px 10px;
            text-align: center;
            box-sizing: border-box;
            background-color: white;
        }
        
        /* 대형 메인 이미지 */
        .main-img-box {
            position: absolute;
            left: 360px;
            top: 50px;
            width: 280px;
            height: 330px;
        }

        /* 하단 컴포넌트 */
        .bottom-left-box { position: absolute; left: 20px; top: 460px; width: 330px; display: flex; gap: 10px; }
        .bottom-img-row { position: absolute; left: 360px; top: 420px; width: 280px; display: flex; gap: 10px; justify-content: center;}

        /* 대형 의상 이미지 및 설명 */
        .cloth-img-box { width: 100%; height: 350px; }
        .cloth-desc-box { width: 100%; border: 1.5px solid black; }

        /* 크레딧 (디자인image_2.png 하단) */
        .credit {
            position: absolute;
            left: 20px;
            bottom: 10px;
            width: 960px;
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #888;
        }

        /* [4. 가독성 설정] */
        input:focus { outline: none; }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 페어틀 메이커🍩</h2>
                <p>트위터 : @DARL1N9__</p>
                <p class="popup-sub-text">출처를 삭제하지 않는 선에서 간단한 가공은 허용하고 있습니다. 처음 만들어 본 사이트라... 이래저래 자잘한 수정사항이 많을 수 있습니다. 잘 부탁드립니다^.^</p>
            </div>
        </div>
    </div>

    <h1>🎬 소솜 캐릭터 메이커</h1>

    <div class="control-panel">
        <label>소솜 간단 페어틀 메이커 (ver 1.0)</label><br>
        <button id="downloadBtn">컴퓨터에 이미지로 저장하기 (PNG)</button>
    </div>

    <div class="capture-area" id="captureArea">
        
        <div class="header">
            <div class="header-left">
                <span class="name-main">A 이름</span>
                <input type="text" class="name-sub" value="Name" placeholder="영어 이름">
            </div>
        </div>

        <div class="grid-left">
            <div class="keyword-row">
                <input type="text" class="input-box keyword-box" value="#키워드">
                <input type="text" class="input-box keyword-box" value="#키워드">
                <input type="text" class="input-box keyword-box" value="#키워드">
            </div>
            <div class="color-row">
                <div class="color-item">SKIN</div>
                <div class="color-item">EYES</div>
                <div class="color-item">HAIR</div>
            </div>
            <input type="text" class="stat-input" value="성별 | 나이 | 키 | 몸무게">
            <textarea class="input-box" rows="7" style="width: 100%;">□ 캐릭터의 주요 특징을 간략 서술</textarea>
        </div>

        <div class="image-box placeholder main-img-box" id="mainImgBox">
            <input type="file" accept="image/*">
            <img>
        </div>

        <div class="grid-right">
            <div class="image-box placeholder cloth-img-box" id="clothImgBox">
                <input type="file" accept="image/*">
                <img>
            </div>
            <textarea class="input-box cloth-desc-box" rows="5" style="width: 100%;">+ 의상에 대한 부가적인 설명을 기입합니다.</textarea>
        </div>

        <div class="bottom-left-box">
            <textarea class="input-box" rows="4" style="flex:1;">캐해 참고</textarea>
            <textarea class="input-box" rows="4" style="flex:1; background-color:white;">이건 안 됩니다...</textarea>
        </div>
        <div class="bottom-img-row">
            <div class="image-box placeholder" id="sdImgBox" style="width: 100px; height: 100px;">
                <input type="file" accept="image/*">
                <img>
            </div>
            <div class="image-box placeholder" id="subImgBox" style="width: 100px; height: 100px;">
                <input type="file" accept="image/*">
                <img>
            </div>
        </div>

        <div class="credit">
            <div>DESIGNED BY XOXOME | @DARL1N9__</div>
            <div>ILLUST BY 이름</div>
        </div>

    </div>

    <script>
        // 1. 팝업창 닫기 함수
        function closePopup() {
            document.getElementById('noticePopup').style.display = 'none';
        }

        // 2. [핵심] 이미지 업로드 기능 구현
        function setupImageBox(boxId) {
            const box = document.getElementById(boxId);
            const input = box.querySelector('input[type="file"]');
            const img = box.querySelector('img');

            // 상자 클릭 시 숨겨진 파일 선택창 열기
            box.addEventListener('click', () => {
                input.click();
            });

            // 파일 선택 시 처리
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        img.src = event.target.result;
                        img.style.display = 'block'; // 이미지 보여주기
                        box.classList.remove('placeholder'); // 안내 문구 숨기기
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // 모든 이미지 상자에 기능 적용
        setupImageBox('mainImgBox');
        setupImageBox('clothImgBox');
        setupImageBox('sdImgBox');
        setupImageBox('subImgBox');

        // 3. 이미지 저장 기능
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const target = document.getElementById('captureArea');
            html2canvas(target, {
                useCORS: true, 
                scale: 2 // 고화질 출력
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'sosom-character-sheet.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
