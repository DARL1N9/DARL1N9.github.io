<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/MaruBuri-Regular.css">
    
    <style>
        /* [1. 전체 레이아웃 스타일 - 화사한 화이트 테마] */
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background-color: #f5f6f7;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #111111;
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            border: 1px solid #000000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* 공통 스타일: 텍스트 박스 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: inherit;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 스타일: 이미지 박스 */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: move;
            box-sizing: border-box;
        }
        .img-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 이미지 업로드 \A (마우스 드래그: 이동 / 휠: 확대)';
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center;
            z-index: 1;
        }
        .image-box input[type="file"] { display: none; }
        
        /* 이미지 원본 비율 유지 및 휠 스케일 기준점 정중앙 고정 */
        .image-box img { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center; 
            display: none; 
            z-index: 2; 
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ==================== 좌표 기반 배치 및 커스텀 스타일 ==================== */
        
        /* [철통 방어] html2canvas 가로 정렬 오류를 방지하기 위한 절대적 크기 및 레이아웃 구조 세팅 */
        .header-name-zone {
            position: absolute;
            left: 45px;
            top: 35px;
            width: 290px;
            height: 40px;
            display: block; /* 가상 복제본 깨짐 방지를 위해 flex 해제 */
        }
        .name-circle-wrapper {
            position: absolute;
            left: 0;
            top: 2px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: #A13B3B; 
            box-sizing: border-box;
            border: 1px solid #000000;
            text-align: center;
        }
        .name-circle-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            padding: 0; margin: 0;
            line-height: 34px; /* 텍스트 수직 솟구침 현상 완벽 제어 */
            z-index: 2;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
            position: relative;
        }
        .name-circle-color-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3;
        }
        .name-main-input {
            position: absolute;
            left: 48px;
            top: 0;
            width: 240px;
            height: 40px;
            font-family: 'MaruBuri', sans-serif; 
            font-size: 20px;
            color: #222222;
            border: none;
            background: none;
            font-weight: bold;
            line-height: 40px;
            padding: 0; margin: 0;
        }

        /* SKIN / EYES / HAIR 컬러 그룹 */
        .color-group {
            position: absolute; left: 45px; top: 132px; width: 285px; display: flex; gap: 7px;
        }
        .color-item-wrapper {
            position: relative; width: 90px; height: 60px; border: 1px solid #000000; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-label {
            font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444;
        }

        /* 좌측 키워드 3개 */
        .keyword-group {
            position: absolute; left: 45px; top: 98px; width: 285px; display: flex; gap: 7px;
        }
        .keyword-box-wrapper {
            position: relative; width: 90px; height: 26px; border: 1px solid #000000; background-color: #444444; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box;
        }
        .keyword-box-input {
            width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-size: 10px; font-weight: bold; color: #ffffff; cursor: pointer; z-index: 2; font-family: inherit;
            padding: 0; margin: 0; line-height: 24px;
        }
        .keyword-bg-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* 스탯 입력 및 안내문구 */
        .info-text { position: absolute; left: 45px; top: 198px; font-size: 9px; color: #666; }
        .stat-input { 
            position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; text-align: center; font-weight: bold; box-sizing: border-box; padding: 0 5px;
            font-family: inherit; line-height: 26px;
        }
        
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; }

        .bottom-desc-group { position: absolute; left: 45px; top: 395px;
