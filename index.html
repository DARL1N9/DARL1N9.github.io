<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 페어틀 메이커</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 기본 파스텔 배경 설정 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #FFF5F5;
            color: #4A4A4A;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            color: #5C4B51;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        /* 원본 이미지와 100% 동일한 비율의 고정 캔버스 (1000px * 563px) */
        .capture-area {
            width: 1000px;
            height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            box-shadow: 0 10px 30px rgba(92, 75, 81, 0.1);
            overflow: hidden;
            border: 1px solid #000000; 
        }

        /* 저장 버튼 스타일링 */
        .bottom-action-panel {
            margin-top: 30px;
            margin-bottom: 50px;
            text-align: center;
            width: 1000px;
        }
        #downloadBtn {
            background-color: #FF8E99;
            color: white;
            font-weight: bold;
            padding: 14px 35px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 142, 153, 0.4);
        }
        #downloadBtn:hover {
            background-color: #FFA3B1;
            transform: translateY(-2px);
        }

        /* 공통 입력상자 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: inherit;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 이미지 업로드 상자 */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
        }
        .image-box.placeholder::before {
            content: '클릭하여 이미지 업로드';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }

        /* ==================== 컴포넌트 절대 좌표 배치 ==================== */
        
        /* 좌측 상단 이름 영역 */
        .header-name-zone {
            position: absolute;
            left: 45px;
            top: 35px;
            display: flex;
            align-items: center;
        }
        /* [수정] 배경색 변경 및 선택이 가능하도록 바뀐 이름창 */
        .name-main-wrapper {
            position: relative;
            background-color: #000000;
            padding: 2px 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .name-main-input {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            background: transparent;
            border: none;
            width: 100px;
            text-align: center;
            cursor: pointer;
            letter-spacing: 1px;
            font-family: inherit;
        }
        .name-bg-picker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .name-sub {
            font-size: 18px;
            color: #888888;
            border: none;
            background: none;
            font-weight: bold;
            width: 150px;
        }

        /* 좌측 키워드 3개 */
        .keyword-group {
            position: absolute;
            left: 45px;
            top: 98px;
            width: 285px;
            display: flex;
            gap: 7px;
        }
        .keyword-box { width: 90px; height: 26px; text-align: center; font-weight: bold; padding: 0; }

        /* [복구] SKIN / EYES / HAIR 컬러 그룹 및 픽커 스타일 */
        .color-group {
            position: absolute;
            left: 45px;
            top: 132px;
            width: 285px;
            display: flex;
            gap: 7px;
            box-sizing: border-box;
        }
        .color-item-wrapper {
            position: relative;
            width: 90px;
            height: 60px;
            border: 1px solid #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-label {
            font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444;
        }

        /* 안내 문구 */
        .info-text { position: absolute; left: 45px; top: 198px; font-size: 9px; color: #666; }

        /* 성별 | 나이 | 키 | 몸무게 */
        .stat-input {
            position: absolute; left: 45px; top: 215px; width: 285px; height: 28px;
            border: 1px solid #000000; background-color: #ffffff; font-size: 12px; text-align: center; font-weight: bold;
        }

        /* 좌측 캐릭터 특징 본문 서술란 */
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; line-height: 1.6; background-color: #F5F5F5; }

        /* 좌측 하단 캐해 참고 / 이건 안 됩니다 박스 */
        .bottom-desc-group { position: absolute; left: 45px; top: 395px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; }

        /* 중앙 메인 전신/흉상 이미지 */
        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }

        /* 중앙 하단 미니 이미지 2개 (SD / 동물화) */
        .mini-img-group {
            position: absolute; left: 355px; top: 395px; width: 280px; display: flex; justify-content: space-between;
        }
        .mini-img-box { width: 134px; height: 110px; position: relative; }
        
        /* [수정] 미니 이미지 라벨 뱃지 배치 우선순위 고정 */
        .mini-badge {
            position: absolute; top: -7px; left: 8px;
            background-color: #ffffff; border: 1px dashed #000000; border-radius: 10px;
            font-size: 9px; padding: 2px 6px; z-index: 10; font-weight: bold;
        }
        /* [신규] 동물화 텍스트 수정 인풋 스타일 */
        .mini-badge-input {
            border: none; background: transparent; font-size: 9px; font-weight: bold;
            width: 75px; text-align: center; padding: 0; margin: 0; font-family: inherit;
        }

        /* 우측 대형 의상 이미지 */
        .cloth-img-box { position: absolute; left: 660px; top: 35px; width: 295px; height: 375px; z-index: 1; }
        .cloth-badge {
            position: absolute; top: 25px; left: 670px;
            background-color: #ffffff; border: 1px dashed #000000; border-radius: 50%;
            width: 34px; height: 34px; text-align: center; line-height: 34px;
            font-size: 10px; font-weight: bold; z-index: 10;
        }

        /* 우측 하단 의상 부가 설명란 */
        .cloth-desc-box { position: absolute; left: 660px; top: 425px; width: 295px; height: 80px; background-color: #F5F5F5; }

        /* 하단 카피라이트 및 크레딧 */
        .credit-line {
            position: absolute; left: 45px; bottom: 12px; width: 910px;
            display: flex; justify-content: space-between; font-size: 9px; color: #999999; letter-spacing: 0.5px; font-weight: bold;
        }

        /* ================= 팝업창 스타일 (트위터 파스텔 톤) ================= */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(92, 75, 81, 0.4); backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .popup-content {
            background-color: #ffffff; color: #4A4A4A;
            width: 90%; max-width: 420px; padding: 35px 25px 25px 25px;
            border-radius: 16px; position: relative; text-align: center;
            box-sizing: border-box; border: 1px solid #FFE3E5;
        }
        /* [복구] 우측 상단 팝업 끄기 X 버튼 */
        .popup-close-btn {
            position: absolute; top: 12px; right: 18px;
            background: none; border: none; color: #BBB; font-size: 28px; cursor: pointer; line-height: 1;
        }
        .popup-close-btn:hover { color: #FF8E99; }
        .popup-badge { background-color: #FF8E99; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        .popup-body h2 { font-size: 20px; margin: 18px 0 10px 0; color: #5C4B51; }
        .popup-body p { font-size: 14px; color: #666; line-height: 1.6; margin: 0 0 8px 0; }
        .popup-body p a { color: #FF8E99; text-decoration: none; font-weight: bold; }
        .popup-body p a:hover { text-decoration: underline; }
        .popup-sub-text {
            font-size: 12px; color: #7A6B70; background-color: #FFF8F8;
            padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left;
            line-height: 1.6; border: 1px dashed #FFD1D5;
        }
        input:focus, textarea:focus { outline: none; }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 페어틀 메이커🍩</h2>
                <p>트위터 : <a href="https://x.com/DARL1N9__" target="_blank">@DARL1N9__</a></p>
                <p class="popup-sub-text">출처를 삭제하지 않는 선에서 간단한 가공은 허용하고 있습니다. 처음 만들어 본 사이트라... 이래저래 자잘한 수정사항이 많을 수 있습니다. 잘 부탁드립니다^.^</p>
            </div>
        </div>
    </div>

    <h1>🍩소솜 간단 페어틀 메이커🍩</h1>

    <div class="capture-area" id="captureArea">
        
        <div class="header-name-zone">
            <div class="name-main-wrapper" id="nameBgWrapper">
                <input type="text" class="name-main-input" id="nameMainTxt" value="A 이름">
                <input type="color" class="name-bg-picker" id="nameBgColor" value="#000000">
            </div>
            <input type="text" class="name-sub" value="Name" placeholder="Name">
        </div>

        <div class="keyword-group">
            <input type="text" class="input-box keyword-box" value="#키워드">
            <input type="text" class="input-box keyword-box" value="#키워드">
            <input type="text" class="input-box keyword-box" value="#키워드">
        </div>

        <div class="color-group">
            <div class="color-item-wrapper" id="skinWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">SKIN</span>
                <input type="color" class="color-input" id="skinColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="eyesWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">EYES</span>
                <input type="color" class="color-input" id="eyesColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="hairWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">HAIR</span>
                <input type="color" class="color-input" id="hairColor" value="#D6D6D6">
            </div>
        </div>

        <div class="info-text">※ 모든 방향은 보는 사람(모니터) 기준입니다. ※</div>
        
        <input type="text" class="stat-input" value="성별 | 나이 | 키 | 몸무게">
        
        <textarea class="input-box main-desc-box">□ 캐릭터의 주요 특징을 간략 서술</textarea>

        <div class="bottom-desc-group">
            <textarea class="input-box bottom-desc-box" style="background-color: #F5F5F5;">캐해 참고&#10;캐해 참고&#10;캐해 참고&#10;캐해 참고</textarea>
            <textarea class="input-box bottom-desc-box" style="background-color: #ffffff;">이건 안 됩니다...</textarea>
        </div>

        <div class="image-box placeholder main-profile-img" id="mainImgBox">
            <input type="file" accept="image/*">
            <img>
        </div>

        <div class="mini-img-group">
            <div class="image-box placeholder mini-img-box" id="sdImgBox">
                <span class="mini-badge">SD</span>
                <input type="file" accept="image/*">
                <img>
            </div>
            <div class="image-box placeholder mini-img-box" id="subImgBox">
                <span class="mini-badge">
                    <input type="text" class="mini-badge-input" value="동물화 : 종류">
                </span>
                <input type="file" accept="image/*">
                <img>
            </div>
        </div>

        <div class="cloth-badge">의상</div>
        <div class="image-box placeholder cloth-img-box" id="clothImgBox">
            <input type="file" accept="image/*">
            <img>
        </div>
        <textarea class="input-box cloth-desc-box">+ 의상에 대한 부가적인 설명을 기입합니다.&#10;의상에 대한 부가적인 설명을 기입합니다.</textarea>

        <div class="credit-line">
            <div>DESIGNED BY XOXOME | @DARL1N9__</div>
            <div>ILLUST BY 이름</div>
        </div>

    </div>

    <div class="bottom-action-panel">
        <button id="downloadBtn">컴퓨터에 이미지로 저장하기 (PNG)</button>
    </div>

    <script>
        // 팝업창 닫기
        function closePopup() {
            document.getElementById('noticePopup').style.display = 'none';
        }

        // 컬러 픽커 실시간 연동 제어 함수
        function setupColorPicker(inputId, wrapperId) {
            const input = document.getElementById(inputId);
            const wrapper = document.getElementById(wrapperId);
            const label = wrapper.querySelector('.color-label, .name-main-input');

            input.addEventListener('input', (e) => {
                const color = e.target.value;
                wrapper.style.backgroundColor = color;
                
                // 배경 명도 계산 후 글자색 자동 반전(가독성 확보)
                const r = parseInt(color.substr(1,2), 16);
                const g = parseInt(color.substr(3,2), 16);
                const b = parseInt(color.substr(5,2), 16);
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                label.style.color = brightness < 128 ? '#ffffff' : '#444444';
            });
        }

        // 컬러 픽커 구동 (기존 3종 + 이름 배경색 1종 추가)
        setupColorPicker('skinColor', 'skinWrapper');
        setupColorPicker('eyesColor', 'eyesWrapper');
        setupColorPicker('hairColor', 'hairWrapper');
        setupColorPicker('nameBgColor', 'nameBgWrapper');

        // 이미지 파일 업로드 함수
        function setupImageBox(boxId) {
            const box = document.getElementById(boxId);
            const input = box.querySelector('input[type="file"]');
            const img = box.querySelector('img');

            box.addEventListener('click', (e) => {
                // 배지 안의 텍스트창을 클릭했을 때는 업로드 창이 열리지 않도록 예외 처리
                if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
                input.click();
            });

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        img.src = event.target.result;
                        img.style.display = 'block';
                        box.classList.remove('placeholder');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // 각 구역에 업로드 매핑
        setupImageBox('mainImgBox');
        setupImageBox('clothImgBox');
        setupImageBox('sdImgBox');
        setupImageBox('subImgBox');

        // 이미지 저장 캡처 기능
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const target = document.getElementById('captureArea');
            
            html2canvas(target, {
                useCORS: true, 
                scale: 2 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'sosom-character-sheet.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
