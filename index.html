<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* [1. 전체 레이아웃 스타일 - 화사한 화이트 테마] */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f6f7;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #111111;
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        input[type="file"] {
            background-color: #f8f9fa;
            cursor: pointer;
            font-size: 14px;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            border: 1px solid #000000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* 공통 스타일: 텍스트 박스 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: inherit;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 스타일: 이미지 박스 (점선 탈출을 위해 overflow 제거) */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
        }
        /* 실제 이미지가 담기는 속 공간만 overflow: hidden 처리 */
        .img-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 이미지 업로드';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center;
            z-index: 1;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; z-index: 2; }

        /* ==================== 좌표 기반 배치 및 커스텀 스타일 ==================== */
        
        /* 좌측 상단 이름 영역 */
        .header-name-zone {
            position: absolute;
            left: 45px;
            top: 35px;
            display: flex;
            align-items: center;
        }
        .name-circle-symbol {
            font-size: 24px;
            font-weight: 900;
            background-color: #000000;
            color: #ffffff;
            width: 38px; height: 38px;
            border-radius: 50%;
            text-align: center;
            line-height: 38px;
            margin-right: 12px;
            letter-spacing: 1px;
        }
        .name-main-input {
            font-size: 18px;
            color: #222222;
            border: none;
            background: none;
            font-weight: bold;
            width: 250px;
        }

        /* SKIN / EYES / HAIR 컬러 그룹 */
        .color-group {
            position: absolute; 
            left: 45px; 
            top: 132px;
            width: 285px; 
            display: flex; 
            gap: 7px;
        }
        .color-item-wrapper {
            position: relative; 
            width: 90px; 
            height: 60px;
            border: 1px solid #000000; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-sizing: border-box;
        }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-label {
            font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444;
        }

        /* 좌측 키워드 3개 */
        .keyword-group {
            position: absolute;
            left: 45px;
            top: 98px;
            width: 285px;
            display: flex;
            gap: 7px;
        }
        .keyword-box-wrapper {
            position: relative;
            width: 90px;
            height: 26px;
            border: 1px solid #000000;
            background-color: #444; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }
        .keyword-box-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            z-index: 2;
        }
        .keyword-bg-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* 고정 좌표계 요소들 */
        .info-text { position: absolute; left: 45px; top: 198px; font-size: 9px; color: #666; }
        .stat-input { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; text-align: center; font-weight: bold; }
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; }

        .bottom-desc-group { position: absolute; left: 45px; top: 395px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; }

        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }
        .mini-img-group { position: absolute; left: 355px; top: 395px; width: 280px; display: flex; justify-content: space-between; }
        
        /* 미니 이미지 전체를 감싸는 개별 박스 고정 크기 */
        .mini-box-container { width: 134px; height: 110px; position: relative; }
        .mini-img-box { width: 100%; height: 100%; }
        
        /* [수정] 테두리 선 위로 완벽하게 올라오는 공통 점선 배지 디자인 스타일 */
        .mini-badge { 
            position: absolute; 
            top: -10px; left: 10px; 
            background-color: #ffffff; 
            border: 1px dashed #000000; 
            border-radius: 12px; 
            font-size: 9px; 
            padding: 2px 10px; 
            z-index: 10; 
            font-weight: bold; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .mini-badge-input { 
            border: none; 
            background: transparent; 
            font-size: 9px; 
            font-weight: bold; 
            width: 75px; 
            text-align: center; 
            font-family: inherit;
            padding: 0;
            margin: 0;
        }

        /* [수정] 우측 의상 컴포넌트 배지 완벽 레이어 오버랩 */
        .cloth-container {
            position: absolute; left: 660px; top: 35px; width: 295px; height: 375px;
        }
        .cloth-img-box { width: 100%; height: 100%; }
        .cloth-badge { 
            position: absolute; 
            top: -15px; left: -15px; 
            background-color: #ffffff; 
            border: 1px dashed #000000; 
            border-radius: 50%; 
            width: 38px; height: 38px; 
            text-align: center; line-height: 38px; 
            font-size: 11px; font-weight: bold; 
            z-index: 10; 
        }

        /* 우측 하단 의상 부가 설명란 */
        .cloth-desc-box { position: absolute; left: 660px; top: 425px; width: 295px; height: 80px; background-color: #F5F5F5; }

        /* 하단 크레딧 */
        .credit-line { position: absolute; left: 45px; bottom: 12px; width: 910px; display: flex; justify-content: space-between; font-size: 9px; color: #999; font-weight: bold; }

        .bottom-action-panel { margin-top: 30px; margin-bottom: 50px; text-align: center; width: 1000px; }
        #downloadBtn { background-color: #007bff; color: white; font-weight: bold; padding: 14px 35px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); }

        /* 팝업 스타일 시스템 */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(92,75,81,0.4); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-content { background-color: #fff; width: 90%; max-width: 420px; padding: 40px 25px 30px 25px; border-radius: 16px; text-align: center; border: 1px solid #FFE3E5; position: relative; box-sizing: border-box; }
        .popup-close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #bbb; line-height: 1; z-index: 10005; padding: 0; }
        .popup-close-btn:hover { color: #007bff; }
        .popup-badge { background-color: #007bff; color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; }
        .popup-body a { color: #007bff; text-decoration: none; font-weight: bold; }
        .popup-sub-text { font-size: 12px; color: #7A6B70; background-color: #FFF8F8; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left; line-height: 1.6; border: 1px dashed #FFD1D5; }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 자료틀 메이커🍩</h2>
                <p style="margin-top: 15px; margin-bottom: 5px;">
                    트위터 : <a href="https://x.com/DARL1N9__" target="_blank">@DARL1N9__</a>
                </p>
                <div class="popup-sub-text">
                    출처를 삭제하지 않는 선에서 간단한 가공은 허용하고 있습니다. 처음 만들어 본 사이트라... 이래저래 자잘한 수정사항이 많을 수 있습니다. 잘 부탁드립니다^.^
                </div>
            </div>
        </div>
    </div>

    <h1>🍩소솜 간단 자료틀 메이커🍩</h1>

    <div class="capture-area" id="captureArea">
        <div class="header-name-zone">
            <div class="name-circle-symbol">Ⓐ</div>
            <input type="text" class="name-main-input" id="nameMainTxt" value="이름 Name" placeholder="이름을 입력하세요">
        </div>

        <div class="keyword-group">
            <div class="keyword-box-wrapper" id="keyWrapper1">
                <input type="text" class="keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor1" value="#444444">
            </div>
            <div class="keyword-box-wrapper" id="keyWrapper2">
                <input type="text" class="keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor2" value="#444444">
            </div>
            <div class="keyword-box-wrapper" id="keyWrapper3">
                <input type="text" class="keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor3" value="#444444">
            </div>
        </div>

        <div class="color-group">
            <div class="color-item-wrapper" id="skinWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">SKIN</span>
                <input type="color" class="color-input" id="skinColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="eyesWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">EYES</span>
                <input type="color" class="color-input" id="eyesColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="hairWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">HAIR</span>
                <input type="color" class="color-input" id="hairColor" value="#D6D6D6">
            </div>
        </div>

        <div class="info-text">※ 모든 방향은 보는 사람(모니터) 기준입니다. ※</div>
        <input type="text" class="stat-input" value="성별 | 나이 | 키 | 몸무게">
        <textarea class="input-box main-desc-box">□ 캐릭터의 주요 특징을 간략 서술</textarea>

        <div class="bottom-desc-group">
            <textarea class="input-box bottom-desc-box" style="background-color: #F5F5F5;">캐해 참고</textarea>
            <textarea class="input-box bottom-desc-box" style="background-color: #ffffff;">이건 안 됩니다...</textarea>
        </div>

        <div class="image-box placeholder main-profile-img" id="mainImgBox">
            <div class="img-container"><img src=""></div>
        </div>

        <div class="mini-img-group">
            <div class="mini-box-container">
                <span class="mini-badge">SD</span>
                <div class="image-box placeholder mini-img-box" id="sdImgBox">
                    <div class="img-container"><img src=""></div>
                </div>
            </div>
            <div class="mini-box-container">
                <span class="mini-badge"><input type="text" class="mini-badge-input" value="동물화 : 종류"></span>
                <div class="image-box placeholder mini-img-box" id="subImgBox">
                    <div class="img-container"><img src=""></div>
                </div>
            </div>
        </div>

        <div class="cloth-container">
            <div class="cloth-badge">의상</div>
            <div class="image-box placeholder cloth-img-box" id="clothImgBox">
                <div class="img-container"><img src=""></div>
            </div>
        </div>
        <textarea class="input-box cloth-desc-box">+ 의상에 대한 부가적인 설명을 기입합니다.</textarea>

        <div class="credit-line"><div>DESIGNED BY XOXOME | @DARL1N9__</div><div>ILLUST BY 이름</div></div>
    </div>

    <div class="bottom-action-panel">
        <button id="downloadBtn">컴퓨터에 이미지로 저장하기 (PNG)</button>
    </div>

    <script>
        function closePopup() { 
            document.getElementById('noticePopup').style.display = 'none'; 
        }

        function setupColorPicker(inputId, wrapperId) {
            const input = document.getElementById(inputId);
            const wrapper = document.getElementById(wrapperId);
            const label = wrapper.querySelector('.color-label, .keyword-box-input');

            if(input && wrapper) {
                input.addEventListener('input', (e) => {
                    const color = e.target.value;
                    wrapper.style.backgroundColor = color;
                    
                    if(label) {
                        const r = parseInt(color.substr(1,2), 16);
                        const g = parseInt(color.substr(3,2), 16);
                        const b = parseInt(color.substr(5,2), 16);
                        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                        label.style.color = brightness < 128 ? '#ffffff' : '#444444';
                    }
                });
            }
        }

        setupColorPicker('skinColor', 'skinWrapper');
        setupColorPicker('eyesColor', 'eyesWrapper');
        setupColorPicker('hairColor', 'hairWrapper');
        setupColorPicker('keyColor1', 'keyWrapper1');
        setupColorPicker('keyColor2', 'keyWrapper2');
        setupColorPicker('keyColor3', 'keyWrapper3');

        function setupImageBox(boxId) {
            const box = document.getElementById(boxId);
            const input = box.querySelector('input[type="file"]');
            const img = box.querySelector('img');
            
            // 이미지 상자가 부모 레이아웃 분리로 직접 타겟팅되지 않을 때를 대비해 input 동적 삽입 보완
            if(box && !input) {
                const newInput = document.createElement('input');
                newInput.type = 'file';
                newInput.accept = 'image/*';
                box.appendChild(newInput);
                box.addEventListener('click', (e) => {
                    if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
                    newInput.click();
                });
                newInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { 
                            img.src = ev.target.result; 
                            img.style.display = 'block'; 
                            box.classList.remove('placeholder'); 
                        };
                        reader.readAsDataURL(file);
                    }
                });
                return;
            }

            if(box && input && img) {
                box.addEventListener('click', (e) => {
                    if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
                    input.click();
                });
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { 
                            img.src = ev.target.result; 
                            img.style.display = 'block'; 
                            box.classList.remove('placeholder'); 
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        setupImageBox('mainImgBox'); setupImageBox('clothImgBox'); setupImageBox('sdImgBox'); setupImageBox('subImgBox');

        const downloadBtn = document.getElementById('downloadBtn');
        if(downloadBtn) {
            downloadBtn.addEventListener('click', () => {
                const target = document.getElementById('captureArea');
                if(target) {
                    html2canvas(target, { useCORS: true, scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'custom-자료틀.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            });
        }
    </script>
</body>
</html>
