<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 파스텔 그린 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        /* [1. 기본 웹 레이아웃 스타일 - #BED197 밝은 녹색 테마 연동] */
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background-color: #F4F7EE; /* 화사하고 부드러운 파스텔 연두빛 배경 */
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #4A533C; /* 카키 카운터 포인트 */
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #BED197;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정 및 원본 이미지 배경 이식)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-image: url('[배포용] 얘 그려주세요 틀.jpg'); /* 원본 이미지 배경 유지 */
            background-size: cover;
            background-position: center;
            position: relative;
            box-sizing: border-box;
            overflow: visible; 
            box-shadow: 0 8px 24px rgba(74,83,60,0.06);
        }

        /* 공통 스타일: 이미지 업로드 상자 */
        .image-box {
            position: absolute;
            cursor: move;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.02); 
            transition: background 0.2s;
        }
        .image-box:hover {
            background-color: rgba(190, 209, 151, 0.08); 
        }
        .img-container {
            width: 100%; height: 100%;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 업로드\A(드래그: 이동 / 휠: 줌)';
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #777777;
            width: 100%;
            text-align: center;
            z-index: 1;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center; 
            display: none; 
            z-index: 2; 
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 공통 스타일: 상단 가변 타이핑 영역 폰트 속성 제어 */
        .transparent-input {
            background: transparent;
            border: none;
            color: #000000;
            font-family: 'Pretendard', sans-serif;
            padding: 0; margin: 0;
            box-sizing: border-box;
        }
        .transparent-input:focus {
            outline: 1px dashed #BED197;
        }
        
        .transparent-textarea {
            background: transparent;
            border: none;
            color: #000000;
            font-family: 'Pretendard', sans-serif;
            padding: 0; margin: 0;
            box-sizing: border-box;
            resize: none;
        }
        .transparent-textarea:focus {
            outline: 1px dashed #BED197;
        }

        /* ==================== 좌표 구역 규격 픽셀 동기화 고정 ==================== */
        .main-profile-img { left: 355px; top: 35px; width: 280px; height: 342px; border: 1px solid #000; }
        .cloth-img-box { left: 660px; top: 35px; width: 295px; height: 375px; border: 1px solid #000; }
        
        .mini-box-container-sd { position: absolute; left: 355px; top: 395px; width: 134px; height: 110px; }
        .mini-box-container-sub { position: absolute; left: 501px; top: 395px; width: 134px; height: 110px; }
        .sd-img-box { width: 100%; height: 100%; border: 1px solid #000; }
        .sub-img-box { width: 100%; height: 100%; border: 1px solid #000; }

        .mini-badge-sd { position: absolute; top: -10px; left: 10px; background: #fff; border: 1px dashed #000; border-radius: 12px; font-size: 9px; padding: 2px 10px; font-weight: bold; z-index: 10; color: #000; }
        .mini-badge-sub { position: absolute; top: -10px; left: 10px; background: #fff; border: 1px dashed #000; border-radius: 12px; font-size: 9px; padding: 2px 6px; z-index: 10; display: inline-flex; }
        .mini-badge-sub-input { width: 75px; text-align: center; font-size: 9px; font-weight: bold; font-family: inherit; }
        .cloth-badge { position: absolute; top: -15px; left: -15px; background: #fff; border: 1px dashed #000; border-radius: 50%; width: 38px; height: 38px; text-align: center; line-height: 38px; font-size: 11px; font-weight: bold; z-index: 10; color: #000; }

        /* 상단 네임텍 레이어 컴포넌트 */
        .header-name-zone { position: absolute; left: 45px; top: 35px; width: 290px; height: 40px; }
        .name-circle-wrapper { position: absolute; left: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; background-color: #000000; border: 1px solid #000000; text-align: center; }
        .name-circle-input { width: 100%; height: 100%; font-size: 18px; font-weight: 900; color: #ffffff; text-align: center; line-height: 34px; cursor: pointer; }
        .name-circle-color-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3; }
        .name-main-input { position: absolute; left: 48px; top: -2px; width: 110px; height: 40px; font-size: 24px; color: #000000; font-weight: 800; line-height: 40px; }
        .name-sub-input { position: absolute; left: 165px; top: 4px; width: 125px; height: 36px; font-size: 18px; color: #b0b0b0; font-weight: 700; line-height: 36px; }

        /* 키워드 블록 패널 */
        .keyword-group { position: absolute; left: 45px; top: 98px; width: 285px; display: flex; gap: 7px; }
        .keyword-box-wrapper { position: relative; width: 90px; height: 26px; background-color: #000000; border: 1px solid #000000; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box; }
        .keyword-box-input { width: 100%; height: 100%; text-align: center; font-size: 10px; font-weight: bold; color: #ffffff; cursor: pointer; z-index: 2; line-height: 24px; }
        .keyword-bg-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* 컬러 픽커 칩 세트 */
        .color-group { position: absolute; left: 45px; top: 132px; width: 285px; display: flex; gap: 7px; }
        .color-item-wrapper { position: relative; width: 90px; height: 60px; border: 1px solid #000000; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .color-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .color-label { font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444; }

        /* 서술형 박스 오버레이 영역 */
        .stat-input { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; text-align: center; font-weight: bold; line-height: 28px; font-size: 14px; }
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; font-size: 12px; padding: 10px 12px; line-height: 1.6; font-weight: 500; }
        .bottom-desc-left { position: absolute; left: 45px; top: 395px; width: 136px; height: 110px; font-size: 12px; padding: 12px; line-height: 1.6; }
        .bottom-desc-right { position: absolute; left: 194px; top: 395px; width: 136px; height: 110px; font-size: 12px; padding: 12px; line-height: 1.6; }
        .cloth-desc-box { position: absolute; left: 660px; top: 425px; width: 295px; height: 80px; font-size: 12px; padding: 10px 12px; line-height: 1.6; }

        .credit-line { position: absolute; left: 45px; bottom: 12px; width: 910px; display: flex; justify-content: space-between; font-size: 9px; color: #999; font-weight: bold; align-items: center; }
        .credit-input { border: none; background: transparent; font-size: 9px; font-weight: bold; color: #999; text-align: right; width: 100px; padding: 0; font-family: inherit; }

        /* 하단 컨트롤러 액션 인터페이스 */
        .bottom-action-panel { margin-top: 30px; margin-bottom: 50px; text-align: center; width: 1000px; }
        #downloadBtn { 
            background-color: #BED197; color: #ffffff; font-weight: bold; padding: 14px 35px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(190, 209, 151, 0.4);
        }
        #downloadBtn:hover { background-color: #CDDEA8; transform: translateY(-1px); }

        /* 알림창 팝업 박스 레이아웃 사양 */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(74, 83, 60, 0.3); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-content { background-color: #fff; width: 90%; max-width: 420px; padding: 40px 25px 30px 25px; border-radius: 16px; text-align: center; border: 1px solid #EBF2DF; position: relative; box-sizing: border-box; color: #333; }
        .popup-close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #ccc; line-height: 1; padding: 0; }
        .popup-close-btn:hover { color: #BED197; }
        .popup-badge { background-color: #BED197; color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; }
        .popup-body h2 { font-size: 20px; margin: 18px 0 10px 0; color: #4A533C; }
        .popup-body a { color: #BED197; text-decoration: none; font-weight: bold; }
        .popup-sub-text { font-size: 12px; color: #69735A; background-color: #F8FAF5; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left; line-height: 1.6; border: 1px dashed #D9E5C3; }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 자료틀 메이커🍩</h2>
                <p style="margin-top: 15px; margin-bottom: 5px;">
                    트위터 : <a href="https://x.com/DARL1N9__" target="_blank">@DARL1N9__</a>
                </p>
                <div class="popup-sub-text">
                    출처를 삭제하지 않는 선에서 간단한 가공은 허용하고 있습니다. 처음 만들어 본 사이트라... 이래저래 자잘한 수정사항이 많을 수 있습니다. 잘 부탁드립니다^.^
                </div>
            </div>
        </div>
    </div>

    <h1>🍩소솜 간단 자료틀 메이커 (파스텔 그린 테마)🍩</h1>

    <div class="capture-area" id="captureArea">
        <div class="header-name-zone">
            <div class="name-circle-wrapper" id="nameCircleWrapper">
                <input type="text" class="transparent-input name-circle-input" id="nameLetterInput" value="A">
                <input type="color" class="name-circle-color-picker" id="nameCircleColor" value="#000000">
            </div>
            <input type="text" class="transparent-input name-main-input" id="nameMainTxt" value="이름" placeholder="이름">
            <input type="text" class="transparent-input name-sub-input" id="nameSubTxt" value="Name" placeholder="Name">
        </div>

        <div class="keyword-group">
            <div class="keyword-box-wrapper" id="keyWrapper1">
                <input type="text" class="transparent-input keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor1" value="#000000">
            </div>
            <div class="keyword-box-wrapper" id="keyWrapper2">
                <input type="text" class="transparent-input keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor2" value="#000000">
            </div>
            <div class="keyword-box-wrapper" id="keyWrapper3">
                <input type="text" class="transparent-input keyword-box-input" value="#키워드">
                <input type="color" class="keyword-bg-picker" id="keyColor3" value="#000000">
            </div>
        </div>

        <div class="color-group">
            <div class="color-item-wrapper" id="skinWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">SKIN</span>
                <input type="color" class="color-input" id="skinColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="eyesWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">EYES</span>
                <input type="color" class="color-input" id="eyesColor" value="#D6D6D6">
            </div>
            <div class="color-item-wrapper" id="hairWrapper" style="background-color: #D6D6D6;">
                <span class="color-label">HAIR</span>
                <input type="color" class="color-input" id="hairColor" value="#D6D6D6">
            </div>
        </div>

        <input type="text" class="transparent-input stat-input" value="성별 | 나이 | 키 | 몸무게">
        <textarea class="transparent-textarea main-desc-box">□ 캐릭터의 주요 특징을 간략 서술&#10;□ 캐릭터의 주요 특징을 간략 서술&#10;□ 캐릭터의 주요 특징을 간략 서술</textarea>

        <textarea class="transparent-textarea bottom-desc-left">캐해 참고&#10;캐해 참고</textarea>
        <textarea class="transparent-textarea bottom-desc-right">이건 안 됩니다...&#10;이건 안 됩니다...</textarea>

        <div class="image-box placeholder main-profile-img" id="mainImgBox">
            <div class="img-container"><img src="" alt=""></div>
        </div>

        <div class="mini-box-container-sd">
            <span class="mini-badge-sd">SD</span>
            <div class="image-box placeholder sd-img-box" id="sdImgBox">
                <div class="img-container"><img src="" alt=""></div>
            </div>
        </div>
        <div class="mini-box-container-sub">
            <span class="mini-badge-sub"><input type="text" class="transparent-input mini-badge-input" value="동물화 : 종류"></span>
            <div class="image-box placeholder sub-img-box" id="subImgBox">
                <div class="img-container"><img src="" alt=""></div>
            </div>
        </div>

        <div class="cloth-container">
            <div class="cloth-badge">의상</div>
            <div class="image-box placeholder cloth-img-box" id="clothImgBox">
                <div class="img-container"><img src="" alt=""></div>
            </div>
        </div>
        <textarea class="transparent-textarea cloth-desc-box">+ 의상에 대한 부가적인 설명을 기입합니다.&#10;의상에 대한 부가적인 설명을 기입합니다.</textarea>

        <div class="credit-line">
            <div>DESIGNED BY XOXOME | @DARL1N9__</div>
            <div>ILLUST BY <input type="text" class="credit-input" value="이름"></div>
        </div>
    </div>

    <div class="bottom-action-panel">
        <button id="downloadBtn">컴퓨터에 이미지로 저장하기 (PNG)</button>
    </div>

    <script>
        function closePopup() { 
            const popup = document.getElementById('noticePopup');
            if(popup) popup.style.display = 'none'; 
        }

        function setupColorPicker(inputId, wrapperId, textElementQuery) {
            const input = document.getElementById(inputId);
            const wrapper = document.getElementById(wrapperId);

            if(input && wrapper) {
                input.addEventListener('input', (e) => {
                    const color = e.target.value;
                    wrapper.style.backgroundColor = color;
                    
                    const label = wrapper.querySelector(textElementQuery);
                    if(label) {
                        const r = parseInt(color.substr(1,2), 16);
                        const g = parseInt(color.substr(3,2), 16);
                        const b = parseInt(color.substr(5,2), 16);
                        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                        label.style.color = brightness < 128 ? '#ffffff' : '#444444';
                    }
                });
            }
        }

        setupColorPicker('skinColor', 'skinWrapper', '.color-label');
        setupColorPicker('eyesColor', 'eyesWrapper', '.color-label');
        setupColorPicker('hairColor', 'hairWrapper', '.color-label');
        setupColorPicker('keyColor1', 'keyWrapper1', '.keyword-box-input');
        setupColorPicker('keyColor2', 'keyWrapper2', '.keyword-box-input');
        setupColorPicker('keyColor3', 'keyWrapper3', '.keyword-box-input');
        setupColorPicker('nameCircleColor', 'nameCircleWrapper', '.name-circle-input');

        function setupInteractiveImageBox(boxId) {
            const box = document.getElementById(boxId);
            if(!box) return;

            let input = box.querySelector('input[type="file"]');
            if(!input) {
                input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                box.appendChild(input);
            }
            const img = box.querySelector('img');

            let isDragging = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let currentScale = 1.0;

            box.addEventListener('click', (e) => {
                if (box.classList.contains('placeholder')) {
                    input.click();
                }
            });

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { 
                        if(img) {
                            img.src = ev.target.result; 
                            img.style.display = 'block'; 
                            box.classList.remove('placeholder');
                            currentX = 0; currentY = 0; currentScale = 1.0;
                            updateImageTransform();
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            box.addEventListener('mousedown', (e) => {
                if (box.classList.contains('placeholder')) return;
                isDragging = true;
                box.style.cursor = 'grabbing';
                startX = e.clientX - currentX;
                startY = e.clientY - currentY;
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                updateImageTransform();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    box.style.cursor = 'move';
                }
            });

            box.addEventListener('wheel', (e) => {
                if (box.classList.contains('placeholder')) return;
                e.preventDefault();
                const zoomFactor = 0.05;
                if (e.deltaY < 0) {
                    currentScale += zoomFactor;
                } else {
                    currentScale = Math.max(0.1, currentScale - zoomFactor);
                }
                updateImageTransform();
            });

            function updateImageTransform() {
                if(img) {
                    img.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
                }
            }
        }

        setupInteractiveImageBox('mainImgBox');
        setupInteractiveImageBox('clothImgBox');
        setupInteractiveImageBox('sdImgBox');
        setupInteractiveImageBox('subImgBox');

        // 이미지 저장 처리 연동 마감
        const downloadBtn = document.getElementById('downloadBtn');
        if(downloadBtn) {
            downloadBtn.addEventListener('click', () => {
                const target = document.getElementById('captureArea');
                if (!target) return;

                if(window.document.fonts && window.document.fonts.ready) {
                    window.document.fonts.ready.then(() => {
                        executeCapture(target);
                    });
                } else {
                    executeCapture(target);
                }
            });
        }

        function executeCapture(target) {
            html2canvas(target, {
                useCORS: true,
                allowTaint: true,
                scale: 2, 
                logging: false,
                onclone: (clonedDoc) => {
                    const inputs = clonedDoc.querySelectorAll('input, textarea');
                    inputs.forEach(input => {
                        input.style.fontFamily = 'Pretendard, sans-serif';
                        input.style.lineHeight = window.getComputedStyle(input).lineHeight;
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'custom-자료틀.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("저장 중 에러 발생:", err);
            });
        }
    </script>
</body>
</html>
