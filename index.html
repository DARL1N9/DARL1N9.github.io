<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 최종 완성 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #F4F7EE; color: #333333; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        h1 { margin-bottom: 30px; font-size: 24px; color: #4A533C; }
        
        .capture-area { width: 1000px; height: 563px; background-color: #ffffff; position: relative; box-sizing: border-box; border: 1px solid #000000; box-shadow: 0 8px 16px rgba(74,83,60,0.06); }
        .input-box { border: 1px solid #000000; font-size: 12px; font-family: 'Pretendard', sans-serif; padding: 8px; box-sizing: border-box; resize: none; overflow: hidden; word-break: break-all; line-height: 1.5; }
        
        .image-box { border: 1px solid #000000; background-color: #ffffff; position: relative; cursor: pointer; box-sizing: border-box; }
        .img-container { width: 100%; height: 100%; overflow: hidden; position: relative; pointer-events: none; }
        .image-box.placeholder .img-container::before { content: '클릭하여 이미지 업로드'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color: #888; text-align: center; }
        .image-box input[type="file"] { display: none; }
        .image-box img { position: absolute; display: none; z-index: 2; user-select: none; }

        .header-name-zone { position: absolute; left: 45px; top: 35px; width: 330px; height: 40px; pointer-events: none; }
        .name-circle-wrapper { position: absolute; left: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; background-color: #000000; border: 1px solid #000000; text-align: center; pointer-events: auto; }
        .name-circle-input { width: 100%; height: 34px; border: none; background: transparent; font-size: 16px; font-weight: 900; color: #ffffff; text-align: center; line-height: 34px; cursor: pointer; font-family: 'Pretendard', sans-serif; }
        .name-circle-color-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3; }
        .name-main-input { position: absolute; left: 48px; top: 0; width: 110px; height: 40px; font-size: 20px; font-weight: 800; border: none; background: none; padding: 0; pointer-events: auto; }
        .name-sub-input { position: absolute; left: 165px; top: 0; width: 150px; height: 40px; font-size: 15px; color: #b0b0b0; border: none; background: none; font-weight: 400; padding: 0; pointer-events: auto; }
        .name-circle-render, .name-main-render, .name-sub-render { display: none; pointer-events: none; }

        .keyword-group { position: absolute; left: 45px; top: 98px; width: 285px; display: flex; gap: 7px; }
        .keyword-box-wrapper { position: relative; width: 90px; height: 26px; border: 1px solid #000000; background-color: #000000; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box; }
        .keyword-box-input { width: 100%; height: 24px; border: none; background: transparent; text-align: center; font-size: 10px; font-weight: bold; color: #ffffff; cursor: pointer; padding: 0 2px; }
        .keyword-bg-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .color-group { position: absolute; left: 45px; top: 132px; width: 285px; display: flex; gap: 7px; }
        .color-item-wrapper { position: relative; width: 90px; height: 60px; border: 1px solid #000000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .color-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .color-label { font-size: 11px; font-weight: bold; pointer-events: none; }

        .stat-input { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; background-color: #ffffff; text-align: center; font-weight: bold; box-sizing: border-box; padding: 4px 5px; font-family: 'Pretendard', sans-serif; font-size: 11px; line-height: 20px; resize: none; overflow: hidden; border-radius: 6px; }
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; }
        .bottom-desc-group { position: absolute; left: 45px; top: 406px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; background-color: #ffffff; border: 1px solid #000000; }
        
        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }
        .mini-img-group { position: absolute; left: 355px; top: 406px; width: 280px; display: flex; justify-content: space-between; }
        .mini-box-container { width: 134px; height: 110px; position: relative; }
        .mini-badge { position: absolute; top: -12px; left: 10px; background-color: #ffffff; border: 1px dashed #000000; border-radius: 14px; font-size: 11px; padding: 0 14px; height: 24px; font-weight: bold; display: flex; align-items: center; box-sizing: border-box; }
        .mini-badge-input { border: none; background: transparent; font-size: 11px; font-weight: bold; width: 85px; text-align: center; font-family: 'Pretendard', sans-serif; padding: 0; }

        .cloth-container { position: absolute; left: 660px; top: 35px; width: 295px; height: 375px; }
        .cloth-desc-box { position: absolute; left: 660px; top: 436px; width: 295px; height: 80px; background-color: #F5F5F5; border: 1px solid #000000; }
        
        .credit-line { position: absolute; left: 45px; top: 538px; width: 910px; height: 18px; display: flex; justify-content: space-between; font-size: 9px; font-weight: bold; align-items: center; }
        .credit-input { border: none; background: transparent; font-size: 9px; font-weight: bold; color: #999999; text-align: right; width: 250px; font-family: 'Pretendard', sans-serif; }
        
        .management-container { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 1000px; }
        .slot-control-bar { display: flex; gap: 10px; align-items: center; background-color: #ffffff; padding: 10px 20px; border-radius: 20px; border: 1px solid #EBF2DF; }
        .slot-selector { padding: 6px 12px; font-size: 14px; border-radius: 6px; font-family: 'Pretendard', sans-serif; font-weight: bold; border: 1px solid #cccccc; cursor: pointer; }
        .slot-btn { padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Pretendard', sans-serif; }
        .btn-save-slot { background-color: #7A8B5C; color: #ffffff; }
        .btn-load-slot { background-color: #4A533C; color: #ffffff; }
        .btn-delete-slot { background-color: #D36C6C; color: #ffffff; }

        .bottom-action-panel { display: flex; gap: 15px; justify-content: center; }
        .panel-btn { color: #ffffff; font-weight: bold; padding: 14px 35px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; font-family: 'Pretendard', sans-serif; }
        #previewBtn { background-color: #7A8B5C; }
        #downloadBtn { background-color: #BED197; }

        /* 모달 팝업 스타일 */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(74, 83, 60, 0.3); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-content { background-color: #fff; padding: 40px 25px; border-radius: 16px; text-align: center; position: relative; }
        .popup-close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #ccc; line-height: 1; }
        
        /* 💡 [신규] 우측 상단 사용 설명서 호버 UI 스타일 */
        .manual-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 9999;
        }
        .manual-btn {
            background-color: #7A8B5C;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: default;
            box-shadow: 0 4px 10px rgba(74,83,60,0.2);
            transition: background-color 0.3s;
        }
        .manual-container:hover .manual-btn {
            background-color: #4A533C;
        }
        .manual-tooltip {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            width: 280px;
            background-color: #ffffff;
            border: 1px solid #EBF2DF;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            font-size: 13px;
            color: #4A533C;
            line-height: 1.6;
            word-break: keep-all;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .manual-container:hover .manual-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="manual-container">
        <div class="manual-btn">✔ 사용 설명서</div>
        <div class="manual-tooltip">
            <strong>💡 알아두면 좋은 꿀팁!</strong><br><br>
            컬러 입력 시 R G B 옆에 있는 작은 기호를 두 번 누르면 <strong>HEX코드 입력 창</strong>으로 바꿀 수 있습니다.
        </div>
    </div>

    <div id="previewModal" class="popup-overlay" style="display: none;">
        <div class="popup-content preview-content">
            <button class="popup-close-btn" onclick="closePreviewModal()">×</button>
            <h2 style="margin: 10px 0; color: #4A533C;">자료틀 저장 전 미리보기</h2>
            <div id="previewCanvasContainer" style="margin-top: 15px;"></div>
        </div>
    </div>

    <h1>🍩소솜 간단 자료틀 메이커🍩</h1>

    <div class="capture-area" id="captureArea">
        <div class="header-name-zone">
            <div class="name-circle-wrapper" id="nameCircleWrapper">
                <input type="text" class="name-circle-input" id="nameLetterInput" value="A">
                <div class="name-circle-render" id="nameCircleRender" style="display:none;"></div>
                <input type="color" class="name-circle-color-picker" id="nameCircleColor" value="#000000">
            </div>
            <input type="text" class="name-main-input" id="nameMainTxt" value="이름" placeholder="이름">
            <div class="name-main-render" id="nameMainRender" style="display:none; position:absolute; left:48px; top:0; font-size:20px; font-weight:800; line-height:40px;"></div>
            
            <input type="text" class="name-sub-input" id="nameSubTxt" value="Name" placeholder="Name">
            <div class="name-sub-render" id="nameSubRender" style="display:none; position:absolute; left:165px; top:0; font-size:15px; color:#b0b0b0; line-height:40px;"></div>
        </div>

        <div class="keyword-group">
            <div class="keyword-box-wrapper" id="keyWrapper1"><input type="text" class="keyword-box-input" value="#키워드"><input type="color" class="keyword-bg-picker" id="keyColor1" value="#000000"></div>
            <div class="keyword-box-wrapper" id="keyWrapper2"><input type="text" class="keyword-box-input" value="#키워드"><input type="color" class="keyword-bg-picker" id="keyColor2" value="#000000"></div>
            <div class="keyword-box-wrapper" id="keyWrapper3"><input type="text" class="keyword-box-input" value="#키워드"><input type="color" class="keyword-bg-picker" id="keyColor3" value="#000000"></div>
        </div>

        <div class="color-group">
            <div class="color-item-wrapper" id="skinWrapper" style="background-color: #D6D6D6;"><span class="color-label">SKIN</span><input type="color" class="color-input" id="skinColor" value="#D6D6D6"></div>
            <div class="color-item-wrapper" id="eyesWrapper" style="background-color: #D6D6D6;"><span class="color-label">EYES</span><input type="color" class="color-input" id="eyesColor" value="#D6D6D6"></div>
            <div class="color-item-wrapper" id="hairWrapper" style="background-color: #D6D6D6;"><span class="color-label">HAIR</span><input type="color" class="color-input" id="hairColor" value="#D6D6D6"></div>
        </div>

        <textarea class="stat-input" id="statInputForm">성별 | 나이 | 키 | 몸무게</textarea>
        <div id="statRender" style="display:none; position:absolute; left:45px; top:215px; width:285px; height:28px; border:1px solid #000; border-radius:6px; background-color:#fff; align-items:center; justify-content:center; font-size:11px; font-weight:bold; font-family:'Pretendard', sans-serif;"></div>
        
        <textarea class="input-box main-desc-box" id="mainDescForm">□ 캐릭터의 주요 특징을 간략 서술</textarea>
        <div id="mainDescRender" class="input-box main-desc-box" style="display:none; white-space:pre-wrap;"></div>

        <div class="bottom-desc-group">
            <textarea class="input-box bottom-desc-box" id="leftDescForm">[O] 캐해 참고</textarea>
            <div id="leftDescRender" class="bottom-desc-box" style="display:none; border:1px solid #000; font-size:12px; white-space:pre-wrap; background-color:#fff;"></div>
            
            <textarea class="input-box bottom-desc-box" id="rightDescForm" style="background-color:#ffffff;">[X] 이건 안 됩니다...</textarea>
            <div id="rightDescRender" class="bottom-desc-box" style="display:none; border:1px solid #000; font-size:12px; white-space:pre-wrap; background-color:#fff;"></div>
        </div>

        <div class="image-box placeholder main-profile-img" id="mainImgBox"><div class="img-container"><img src="" alt=""></div></div>
        
        <div class="mini-img-group">
            <div class="mini-box-container">
                <span class="mini-badge">SD</span>
                <div class="image-box placeholder mini-img-box" id="sdImgBox"><div class="img-container"><img src="" alt=""></div></div>
            </div>
            <div class="mini-box-container">
                <span class="mini-badge">
                    <input type="text" class="mini-badge-input" id="animalBadgeInput" value="동물화 : 종류">
                    <div id="animalBadgeRender" style="display:none; font-size:11px; font-weight:bold;"></div>
                </span>
                <div class="image-box placeholder mini-img-box" id="subImgBox"><div class="img-container"><img src="" alt=""></div></div>
            </div>
        </div>

        <div class="cloth-container">
            <div class="cloth-badge">의상</div>
            <div class="image-box placeholder cloth-img-box" id="clothImgBox"><div class="img-container"><img src="" alt=""></div></div>
        </div>
        <textarea class="input-box cloth-desc-box" id="clothDescForm">+ 의상에 대한 부가적인 설명을 기입합니다.</textarea>
        <div id="clothDescRender" class="input-box cloth-desc-box" style="display:none; white-space:pre-wrap;"></div>

        <div class="credit-line">
            <div>DESIGNED BY XOXOME | @DARL1N9__</div>
            <div class="credit-right-zone">
                <input type="text" class="credit-input" id="creditIllustInput" value="ILLUST BY 이름">
                <div id="creditIllustRender" class="credit-input" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="management-container">
        <div class="slot-control-bar">
            <select id="slotSelect" class="slot-selector">
                <option value="slot_1">슬롯 1</option>
                <option value="slot_2">슬롯 2</option>
                <option value="slot_3">슬롯 3</option>
            </select>
            <button class="slot-btn btn-save-slot" onclick="saveToSlot()">저장</button>
            <button class="slot-btn btn-load-slot" onclick="loadFromSlot()">불러오기</button>
            <button class="slot-btn btn-delete-slot" onclick="deleteFromSlot()">삭제</button>
        </div>
        <div class="bottom-action-panel">
            <button id="previewBtn" class="panel-btn">저장 이미지 미리보기</button>
            <button id="downloadBtn" class="panel-btn" style="background-color:#BED197;">이미지로 저장하기</button>
        </div>
    </div>

    <script>
        // 전역 레지스트리 및 색상 동기화
        const globalImgRegistry = { mainImgBox: {}, clothImgBox: {}, sdImgBox: {}, subImgBox: {} };
        
        function closePreviewModal() {
            document.getElementById('previewModal').style.display = 'none';
        }

        const circlePicker = document.getElementById('nameCircleColor');
        circlePicker.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('nameCircleWrapper').style.backgroundColor = val;
            document.querySelectorAll('.keyword-box-wrapper').forEach(el => el.style.backgroundColor = val);
        });

        function setupColorPicker(inputId, wrapperId, textQuery) {
            const input = document.getElementById(inputId);
            const wrapper = document.getElementById(wrapperId);
            if(input && wrapper) {
                input.addEventListener('input', (e) => {
                    const color = e.target.value;
                    wrapper.style.backgroundColor = color;
                    const label = wrapper.querySelector(textQuery);
                    if(label) {
                        const r = parseInt(color.substr(1,2), 16), g = parseInt(color.substr(3,2), 16), b = parseInt(color.substr(5,2), 16);
                        label.style.color = ((r * 299 + g * 587 + b * 114) / 1000) < 128 ? '#ffffff' : '#444444';
                    }
                });
            }
        }
        setupColorPicker('skinColor', 'skinWrapper', '.color-label');
        setupColorPicker('eyesColor', 'eyesWrapper', '.color-label');
        setupColorPicker('hairColor', 'hairWrapper', '.color-label');
        setupColorPicker('keyColor1', 'keyWrapper1', '.keyword-box-input');
        setupColorPicker('keyColor2', 'keyWrapper2', '.keyword-box-input');
        setupColorPicker('keyColor3', 'keyWrapper3', '.keyword-box-input');

        function setupInteractiveImageBox(boxId) {
            const box = document.getElementById(boxId);
            const input = box.querySelector('input[type="file"]') || document.createElement('input');
            if(!input.parentElement) { input.type = 'file'; input.accept = 'image/*'; box.appendChild(input); }
            const img = box.querySelector('img');
            let imgState = globalImgRegistry[boxId];
            let isDragging = false, startX = 0, startY = 0, mousedownTime = 0;

            box.onclick = (e) => {
                if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
                if(Date.now() - mousedownTime < 200) input.click();
            };
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    imgState.src = ev.target.result;
                    img.onload = () => {
                        box.classList.remove('placeholder');
                        img.style.display = 'block';
                        imgState.width = box.clientWidth;
                        imgState.height = box.clientWidth / (img.naturalWidth / img.naturalHeight);
                        imgState.scale = 1.0;
                        imgState.left = 0; imgState.top = 0;
                        applyPhysicalTransform();
                    };
                };
                if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
            };
            box.onmousedown = (e) => {
                if(e.target.tagName === 'INPUT') return;
                mousedownTime = Date.now();
                if(box.classList.contains('placeholder')) return;
                isDragging = true; startX = e.clientX - imgState.left; startY = e.clientY - imgState.top; e.preventDefault();
            };
            window.addEventListener('mousemove', (e) => { if(isDragging) { imgState.left = e.clientX - startX; imgState.top = e.clientY - startY; applyPhysicalTransform(); }});
            window.addEventListener('mouseup', () => { isDragging = false; });
            box.onwheel = (e) => {
                if(box.classList.contains('placeholder')) return;
                e.preventDefault();
                const rect = box.getBoundingClientRect(), mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                const prevScale = imgState.scale;
                imgState.scale = Math.max(0.1, imgState.scale + (e.deltaY < 0 ? 0.05 : -0.05));
                imgState.left = mouseX - (mouseX - imgState.left) * (imgState.scale / prevScale);
                imgState.top = mouseY - (mouseY - imgState.top) * (imgState.scale / prevScale);
                applyPhysicalTransform();
            };
            function applyPhysicalTransform() { if(img) { img.style.width = (imgState.width * imgState.scale)+'px'; img.style.height = (imgState.height * imgState.scale)+'px'; img.style.left = imgState.left+'px'; img.style.top = imgState.top+'px'; } }
        }
        ['mainImgBox', 'clothImgBox', 'sdImgBox', 'subImgBox'].forEach(setupInteractiveImageBox);

        function updateSlotLabels() {
            ['slot_1', 'slot_2', 'slot_3'].forEach((key, index) => {
                const opt = document.querySelectorAll('#slotSelect option')[index];
                const raw = localStorage.getItem(key);
                opt.innerText = raw ? `슬롯 ${index+1} (${JSON.parse(raw).name || '이름 없음'})` : `슬롯 ${index+1} (비어있음)`;
            });
        }
        updateSlotLabels();

        function saveToSlot() {
            const data = {
                name: document.getElementById('nameMainTxt').value,
                letter: document.getElementById('nameLetterInput').value,
                subName: document.getElementById('nameSubTxt').value,
                k1: document.querySelectorAll('.keyword-box-input')[0].value, k1c: document.getElementById('keyColor1').value,
                k2: document.querySelectorAll('.keyword-box-input')[1].value, k2c: document.getElementById('keyColor2').value,
                k3: document.querySelectorAll('.keyword-box-input')[2].value, k3c: document.getElementById('keyColor3').value,
                sc: document.getElementById('skinColor').value, ec: document.getElementById('eyesColor').value, hc: document.getElementById('hairColor').value,
                stat: document.getElementById('statInputForm').value,
                desc: document.getElementById('mainDescForm').value,
                left: document.getElementById('leftDescForm').value,
                right: document.getElementById('rightDescForm').value,
                animal: document.getElementById('animalBadgeInput').value,
                cloth: document.getElementById('clothDescForm').value,
                illust: document.getElementById('creditIllustInput').value,
                circle: document.getElementById('nameCircleColor').value,
                images: globalImgRegistry
            };
            try { localStorage.setItem(document.getElementById('slotSelect').value, JSON.stringify(data)); updateSlotLabels(); alert("저장 완료!"); } 
            catch(e) { alert("용량 초과! 작은 이미지를 사용해주세요."); }
        }

        function loadFromSlot() {
            const saved = localStorage.getItem(document.getElementById('slotSelect').value);
            if (!saved) return alert("저장된 데이터 없음");
            const data = JSON.parse(saved);

            document.getElementById('nameMainTxt').value = data.name || '';
            document.getElementById('nameLetterInput').value = data.letter || 'A';
            document.getElementById('nameSubTxt').value = data.subName || '';
            document.querySelectorAll('.keyword-box-input')[0].value = data.k1 || ''; document.getElementById('keyColor1').value = data.k1c || '#000000';
            document.querySelectorAll('.keyword-box-input')[1].value = data.k2 || ''; document.getElementById('keyColor2').value = data.k2c || '#000000';
            document.querySelectorAll('.keyword-box-input')[2].value = data.k3 || ''; document.getElementById('keyColor3').value = data.k3c || '#000000';
            document.getElementById('skinColor').value = data.sc || '#D6D6D6';
            document.getElementById('eyesColor').value = data.ec || '#D6D6D6';
            document.getElementById('hairColor').value = data.hc || '#D6D6D6';
            document.getElementById('statInputForm').value = data.stat || '';
            document.getElementById('mainDescForm').value = data.desc || '';
            document.getElementById('leftDescForm').value = data.left || '';
            document.getElementById('rightDescForm').value = data.right || '';
            document.getElementById('animalBadgeInput').value = data.animal || '';
            document.getElementById('clothDescForm').value = data.cloth || '';
            document.getElementById('creditIllustInput').value = data.illust || '';
            document.getElementById('nameCircleColor').value = data.circle || '#000000';

            if(data.images) {
                Object.keys(data.images).forEach(id => {
                    const st = data.images[id]; const box = document.getElementById(id);
                    if(box && st.src) {
                        const img = box.querySelector('img'); img.src = st.src; img.style.display = 'block'; box.classList.remove('placeholder');
                        globalImgRegistry[id] = st;
                        img.onload = () => { img.style.width = (st.width*st.scale)+'px'; img.style.height = (st.height*st.scale)+'px'; img.style.left = st.left+'px'; img.style.top = st.top+'px'; };
                    }
                });
            }
            setTimeout(() => { ['nameCircleColor', 'skinColor', 'eyesColor', 'hairColor', 'keyColor1', 'keyColor2', 'keyColor3'].forEach(id => { const el = document.getElementById(id); if(el) el.dispatchEvent(new Event('input')); }); }, 150);
            alert("불러오기 완료!");
        }

        function deleteFromSlot() {
            if(confirm("정말로 이 슬롯을 초기화하시겠습니까?")) {
                localStorage.removeItem(document.getElementById('slotSelect').value);
                updateSlotLabels();
                alert("슬롯 초기화 완료.");
            }
        }

        function transformInputsForCapture() {
            const map = [
                { i: 'nameLetterInput', o: 'nameCircleRender', d: 'block' }, { i: 'nameMainTxt', o: 'nameMainRender', d: 'block' }, { i: 'nameSubTxt', o: 'nameSubRender', d: 'block' },
                { i: 'statInputForm', o: 'statRender', d: 'flex' }, { i: 'mainDescForm', o: 'mainDescRender', d: 'block' },
                { i: 'leftDescForm', o: 'leftDescRender', d: 'block' }, { i: 'rightDescForm', o: 'rightDescRender', d: 'block' },
                { i: 'animalBadgeInput', o: 'animalBadgeRender', d: 'flex' }, { i: 'clothDescForm', o: 'clothDescRender', d: 'block' },
                { i: 'creditIllustInput', o: 'creditIllustRender', d: 'block' }
            ];
            map.forEach(m => { const i = document.getElementById(m.i), o = document.getElementById(m.o); if(i && o) { o.innerText = i.value; o.style.display = m.d; i.style.display = 'none'; } });
        }

        document.getElementById('previewBtn').addEventListener('click', () => {
            transformInputsForCapture();
            html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
                const c = document.getElementById('previewCanvasContainer'); c.innerHTML = ''; c.appendChild(canvas);
                document.getElementById('previewModal').style.display = 'flex';
                restoreInputsAfterCapture();
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            transformInputsForCapture();
            html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
                const a = document.createElement('a'); a.download = '자료틀.png'; a.href = canvas.toDataURL(); a.click();
                restoreInputsAfterCapture();
            });
        });

        function restoreInputsAfterCapture() {
            const map = ['nameLetterInput', 'nameMainTxt', 'nameSubTxt', 'statInputForm', 'mainDescForm', 'leftDescForm', 'rightDescForm', 'animalBadgeInput', 'clothDescForm', 'creditIllustInput'];
            const render = ['nameCircleRender', 'nameMainRender', 'nameSubRender', 'statRender', 'mainDescRender', 'leftDescRender', 'rightDescRender', 'animalBadgeRender', 'clothDescRender', 'creditIllustRender'];
            map.forEach((m, idx) => { document.getElementById(m).style.display = ''; document.getElementById(render[idx]).style.display = 'none'; });
        }
    </script>
</body>
</html>
