<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        body { font-family: 'Pretendard', 'Arial', sans-serif; background-color: #F4F7EE; color: #333333; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        h1 { margin-bottom: 30px; font-size: 24px; color: #4A533C; }
        input, select, button { padding: 10px; border-radius: 4px; border: 1px solid #cccccc; font-size: 16px; }
        input, select { background-color: #ffffff; color: #333333; }
        input:focus, textarea:focus { outline: none; border-color: #BED197; }

        .capture-area {
            width: 1000px; height: 563px; background-color: #ffffff; position: relative; box-sizing: border-box; color: black; border: 1px solid #000000; box-shadow: 0 8px 16px rgba(74,83,60,0.06);
        }

        /* 텍스트 박스 스타일 */
        .input-box { border: 1px solid #000000; font-size: 12px; font-family: 'Pretendard', sans-serif; padding: 8px; box-sizing: border-box; resize: none; overflow: hidden; }
        
        .image-box { border: 1px solid #000000; background-color: #ffffff; position: relative; cursor: pointer; box-sizing: border-box; }
        .img-container { width: 100%; height: 100%; overflow: hidden; position: relative; pointer-events: none; }
        .image-box.placeholder .img-container::before { content: '클릭하여 이미지 업로드 \A (마우스 드래그: 이동 / 휠: 확대)'; white-space: pre-wrap; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color: #888; width: 100%; text-align: center; z-index: 1; }
        .image-box input[type="file"] { display: none; }
        .image-box img { position: absolute; display: none; z-index: 2; user-select: none; -webkit-user-drag: none; }

        /* [이름 폼] */
        .header-name-zone { position: absolute; left: 45px; top: 35px; width: 330px; height: 40px; pointer-events: none; }
        .name-circle-wrapper { position: absolute; left: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; background-color: #000000; box-sizing: border-box; border: 1px solid #000000; text-align: center; pointer-events: auto; }
        .name-circle-input, .name-circle-render { width: 100%; height: 34px; border: none; background: transparent; font-size: 16px; font-weight: 900; color: #ffffff; text-align: center; padding: 0; margin: 0; line-height: 34px; z-index: 2; cursor: pointer; font-family: 'Pretendard', sans-serif; position: relative; }
        .name-circle-color-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3; }
        .name-circle-render { display: none; pointer-events: none; }
        
        .name-main-input, .name-main-render { position: absolute; left: 48px; top: 0; width: 110px; height: 40px; font-family: 'Pretendard', sans-serif; font-size: 20px; color: #000000; border: none; background: none; font-weight: 800; line-height: 40px; padding: 0; margin: 0; box-sizing: border-box; pointer-events: auto; word-break: break-all; }
        .name-sub-input, .name-sub-render { position: absolute; left: 165px; top: 0; width: 150px; height: 40px; font-family: 'Pretendard', sans-serif; font-size: 15px; color: #b0b0b0; border: none; background: none; font-weight: 400; line-height: 40px; padding: 0; margin: 0; box-sizing: border-box; pointer-events: auto; word-break: break-all; }
        .name-main-render, .name-sub-render { display: none; pointer-events: none; text-align: left; }

        /* [스탯 박스] */
        .stat-input { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; background-color: #ffffff; text-align: center; font-weight: bold; box-sizing: border-box; padding: 4px 5px 0 5px; font-family: 'Pretendard', sans-serif; font-size: 11px; line-height: 1.4; resize: none; overflow: hidden; border-radius: 6px; }
        .stat-render { position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; border-radius: 6px; display: none; align-items: center; justify-content: center; font-weight: bold; font-family: 'Pretendard', sans-serif; font-size: 11px; background-color: #ffffff; }

        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; word-break: break-all; line-height: 1.5; }
        .bottom-desc-group { position: absolute; left: 45px; top: 398px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; word-break: break-all; line-height: 1.5; }

        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }
        .mini-img-group { position: absolute; left: 355px; top: 398px; width: 280px; display: flex; justify-content: space-between; }
        .mini-box-container { width: 134px; height: 110px; position: relative; }
        .mini-img-box { width: 100%; height: 100%; }

        /* ... 기타 스타일 유지 ... */
        .management-container { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 1000px; }
        .slot-control-bar { display: flex; gap: 10px; align-items: center; background-color: #ffffff; padding: 10px 20px; border-radius: 20px; border: 1px solid #EBF2DF; box-shadow: 0 4px 10px rgba(74,83,60,0.03); }
        .slot-selector { padding: 6px 12px; font-size: 14px; border-radius: 6px; font-family: 'Pretendard', sans-serif; font-weight: bold; border: 1px solid #cccccc; cursor: pointer; }
        .slot-btn { padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; font-family: 'Pretendard', sans-serif; transition: all 0.2s; }
        .btn-save-slot { background-color: #7A8B5C; color: #ffffff; }
        .btn-load-slot { background-color: #4A533C; color: #ffffff; }
        .bottom-action-panel { display: flex; gap: 15px; justify-content: center; }
        .panel-btn { color: #ffffff; font-weight: bold; padding: 14px 35px; border-radius: 30px; border: none; font-size: 16px; cursor: pointer; font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body>

    <textarea class="stat-input" id="statInputForm">성별 | 나이 | 키 | 몸무게</textarea>
    <div class="stat-render" id="statRender"></div>

    <script>
        // [중요] 캡처 시 스탯창 정가운데 정렬 렌더링 로직
        function transformInputsForCapture(clonedDoc) {
            // ... 기존 이름/SD/동물화 치환 로직 ...
            const statInput = clonedDoc.getElementById('statInputForm');
            const statRender = clonedDoc.getElementById('statRender');
            if (statInput && statRender) {
                statRender.innerText = statInput.value;
                statRender.style.display = 'flex';
                statInput.style.display = 'none';
            }
            // ... 나머지 기존 로직 ...
        }

        // [컬러 덮어씌움 버그 패치] 로드 후 100ms 뒤에 강제 동기화
        function loadFromSlot() {
            // ... 기존 로드 로직 ...
            setTimeout(() => {
                triggerColorPickerUpdate();
            }, 100);
        }
    </script>
</body>
</html>
