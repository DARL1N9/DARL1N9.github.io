<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        /* [1. 전체 레이아웃 스타일 - #BED197 연두 파스텔 테마] */
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background-color: #F4F7EE; 
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #4A533C; 
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #BED197;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            border: 1px solid #000000;
            box-shadow: 0 8px 16px rgba(74,83,60,0.06);
        }

        /* 공통 스타일: 텍스트 박스 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: 'Pretendard', sans-serif;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 스타일: 이미지 박스 */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: move;
            box-sizing: border-box;
        }
        .img-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 이미지 업로드 \A (마우스 드래그: 이동 / 휠: 확대)';
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center;
            z-index: 1;
        }
        .image-box input[type="file"] { display: none; }
        
        /* 이미지 원본 비율 유지 및 휠 스케일 기준점 정중앙 고정 */
        .image-box img { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center; 
            display: none; 
            z-index: 2; 
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ==================== 좌표 기반 배치 및 커스텀 스타일 ==================== */
        
        /* [저장 뒤틀림 방지] 이름 구역 절대 좌표 고정 */
        .header-name-zone {
            position: absolute;
            left: 45px;
            top: 35px;
            width: 290px;
            height: 40px;
            display: block; 
        }
        .name-circle-wrapper {
            position: absolute;
            left: 0;
            top: 2px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: #000000; 
            box-sizing: border-box;
            border: 1px solid #000000;
            text-align: center;
        }
        .name-circle-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            padding: 0; margin: 0;
            line-height: 34px; 
            z-index: 2;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
            position: relative;
        }
        .name-circle-color-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3;
        }
        
        /* 한글 이름 입력창 - Pretendard 검은색 굵게 핏 세팅 */
        .name-main-input {
            position: absolute;
            left: 48px;
            top: 0;
            width: 110px;
            height: 40px;
            font-family: 'Pretendard', sans-serif; 
            font-size: 24px;
            color: #000000;
            border: none;
            background: none;
            font-weight: 800;
            line-height: 40px;
            padding: 0; margin: 0;
        }
        
        /* 영어 Name 입력창 - Pretendard 회색 핏 세팅 */
        .name-sub-input {
            position: absolute;
            left: 165px;
            top: 4px;
            width: 125px;
            height: 36px;
            font-family: 'Pretendard', sans-serif; 
            font-size: 18px;
            color: #888888;
            border: none;
            background: none;
            font-weight: 700;
            line-height: 36px;
            padding: 0; margin: 0;
        }

        /* SKIN / EYES / HAIR 컬러 그룹 */
        .color-group {
            position: absolute; left: 45px; top: 132px; width: 285px; display: flex; gap: 7px;
        }
        .color-item-wrapper {
            position: relative; width: 90px; height: 60px; border: 1px solid #000000; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
        }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .color-label {
            font-size: 11px; font-weight: bold; pointer-events: none; z-index: 2; color: #444444; font-family: 'Pretendard', sans-serif;
        }

        /* 좌측 키워드 3개 */
        .keyword-group {
            position: absolute; left: 45px; top: 98px; width: 285px; display: flex; gap: 7px;
        }
        .keyword-box-wrapper {
            position: relative; width: 90px; height: 26px; border: 1px solid #000000; background-color: #000000; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box;
        }
        .keyword-box-input {
            width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-size: 10px; font-weight: bold; color: #ffffff; cursor: pointer; z-index: 2; font-family: 'Pretendard', sans-serif;
            padding: 0; margin: 0; line-height: 24px;
        }
        .keyword-bg-picker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* 스탯 입력 및 안내문구 */
        .info-text { position: absolute; left: 45px; top: 198px; font-size: 9px; color: #666; font-family: 'Pretendard', sans-serif; }
        .stat-input { 
            position: absolute; left: 45px; top: 215px; width: 285px; height: 28px; border: 1px solid #000; text-align: center; font-weight: bold; box-sizing: border-box; padding: 0 5px;
            font-family: 'Pretendard', sans-serif; line-height: 26px;
        }
        
        .main-desc-box { position: absolute; left: 45px; top: 252px; width: 285px; height: 125px; background-color: #F5F5F5; }

        .bottom-desc-group { position: absolute; left: 45px; top: 395px; width: 285px; height: 110px; display: flex; gap: 12px; }
        .bottom-desc-box { flex: 1; height: 100%; border-radius: 16px; padding: 12px; }

        /* 이미지 컨테이너 공간 레이아웃 */
        .main-profile-img { position: absolute; left: 355px; top: 35px; width: 280px; height: 342px; }
        .mini-img-group { position: absolute; left: 355px; top: 395px; width: 280px; display: flex; justify-content: space-between; }
        
        .mini-box-container { width: 134px; height: 110px; position: relative; }
        .mini-img-box { width: 100%; height: 100%; }
        
        .mini-badge { 
            position: absolute; top: -10px; left: 10px; background-color: #ffffff; border: 1px dashed #000000; border-radius: 12px; font-size: 9px; padding: 2px 10px; z-index: 10; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; font-family: 'Pretendard', sans-serif;
        }
        .mini-badge-input { 
            border: none; background: transparent; font-size: 9px; font-weight: bold; width: 75px; text-align: center; font-family: 'Pretendard', sans-serif; padding: 0; margin: 0;
        }

        /* 우측 의상 프레임 */
        .cloth-container { position: absolute; left: 660px; top: 35px; width: 295px; height: 375px; }
        .cloth-img-box { width: 100%; height: 100%; }
        .cloth-badge { 
            position: absolute; top: -15px; left: -15px; background-color: #ffffff; border: 1px dashed #000000; border-radius: 50%; width: 38px; height: 38px; text-align: center; line-height: 38px; font-size: 11px; font-weight: bold; z-index: 10; font-family: 'Pretendard', sans-serif;
        }

        .cloth-desc-box { position: absolute; left: 660px; top: 425px; width: 295px; height: 80px; background-color: #F5F5F5; }
        
        /* 크레딧 스타일 */
        .credit-line { position: absolute; left: 45px; bottom: 12px; width: 910px; display: flex; justify-content: space-between; font-size: 9px; color: #999; font-weight: bold; align-items: center; font-family: 'Pretendard', sans-serif;}
        .credit-input { border: none; background: transparent; font-size: 9px; font-weight: bold; color: #999; text-align: right; width: 100px; padding: 0; font-family: 'Pretendard', sans-serif; }

        .bottom-action-panel { margin-top: 30px; margin-bottom: 50px; text-align: center; width: 1000px; }
        #downloadBtn { 
            background-color: #BED197; 
            color: #ffffff; 
            font-weight: bold; 
            padding: 14px 35px; 
            border-radius: 30px; 
            border: none; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(190, 209, 151, 0.4); 
            font-family: 'Pretendard', sans-serif;
        }
        #downloadBtn:hover {
            background-color: #CDDEA8; 
            transform: translateY(-1px);
        }

        /* 팝업 스타일 시스템 */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(74, 83, 60, 0.3); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-content { background-color: #fff; width: 90%; max-width: 420px; padding: 40px 25px 30px 25px; border-radius: 16px; text-align: center; border: 1px solid #EBF2DF; position: relative; box-sizing: border-box; }
        .popup-close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #ccc; line-height: 1; z-index: 10005; padding: 0; }
        .popup-close-btn:hover { color: #BED197; }
        .popup-badge { background-color: #BED197; color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; }
        .popup-body h2 { font-size: 20px; margin: 18px 0 10px 0; color: #4A533C; }
        .popup-body a { color: #BED197; text-decoration: none; font-weight: bold; }
        .popup-body a:hover { text-decoration: underline; }
        .popup-sub-text { font-size: 12px; color: #69735A; background-color: #F8FAF5; padding: 12px; border-radius: 8px; margin-top: 15px; text-align: left; line-height: 1.6; border: 1px dashed #D9E5C3; }
    </style>
</head>
<body>

    <div id="noticePopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close-btn" onclick="closePopup()">×</button>
            <div class="popup-body">
                <span class="popup-badge">NOTICE</span>
                <h2>🍩소솜 간단 자료틀 메이커🍩</h2>
                <p style="margin-top: 15px; margin-bottom: 5px;">
                    트위터 : <a href="https://x.com/DARL1N9__" target="_blank">@DARL1N9__</a>
                </p>
                <div class="popup-sub-text">
                    출처를 삭제하지 않는 선에서 간단한 가공은 허용하고 있습니다. 처음 만들어 본 사이트라... 이래저래 자잘한 수정사항이 많을 수 있습니다. 잘 부탁드립니다^.^
                </div>
            </div>
        </div>
    </div>

    <h1>🍩소솜 간단 자료틀 메이커🍩</h1>

    <div class="capture-area" id="captureArea">
        
        <div class="header-name-zone">
            <div class="name-circle-wrapper" id="nameCircleWrapper">
                <input type="text" class="name-circle-input" id="nameLetterInput" value="A">
                <input type="color" class="name-circle-color-picker" id="nameCircleColor" value="#000000">
            </div>
            <input type="text" class="name-main-input" id="nameMainTxt" value="이름" placeholder="이름">
            <input type="text" class="name-sub-input" id="nameSubTxt" value="Name" placeholder="Name">
        </div>

        <div class="keyword-group">
            <div class="keyword-box-wrapper" id="keyWrapper1">
                <input type
