<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 커스텀 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/MaruBuri-Regular.css">
    
    <style>
        /* [1. 전체 레이아웃 스타일 - 화사한 화이트 테마] */
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background-color: #f5f6f7;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #111111;
        }

        /* 입력창 배경 및 테두리 선 */
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 16px;
        }
        input, select {
            background-color: #ffffff;
            color: #333333;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            color: black;
            border: 1px solid #000000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* 공통 스타일: 텍스트 박스 */
        .input-box {
            border: 1px solid #000000;
            background-color: #F0F0F0;
            font-size: 12px;
            font-family: inherit;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }
        
        /* 공통 스타일: 이미지 박스 */
        .image-box {
            border: 1px solid #000000;
            background-color: #ffffff;
            position: relative;
            cursor: move;
            box-sizing: border-box;
        }
        .img-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 이미지 업로드 \A (마우스 드래그: 이동 / 휠: 확대)';
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #888;
            width: 100%;
            text-align: center
