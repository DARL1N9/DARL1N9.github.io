<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 커스텀 이미지 제작기</title>
    <!-- 화면 캡처를 도와주는 외부 라이브러리 불러오기 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #141414;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            width: 100%;
        }
        /* 컨트롤러 양식 */
        .control-panel {
            background-color: #2f2f2f;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
        }
        input, select {
            background-color: #444;
            color: white;
        }
        button {
            background-color: #E50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #b80710;
        }
        /* 이미지 캔버스 공간 (캡처될 영역) */
        .preview-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            border: 2px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        /* 넷플릭스풍 붉은 그라데이션 오버레이 효과 */
        .preview-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 40%, rgba(229, 9, 20, 0.3) 100%);
            pointer-events: none;
        }
        .preview-title {
            font-size: 32px;
            font-weight: 900;
            color: #E50914;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }
        .preview-subtitle {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
            letter-spacing: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎬 NET-STYLE 이미지 생성기</h1>

    <div class="container">
        <!-- 설정 입력창 -->
        <div class="control-panel">
            <div style="display: flex; flex-direction: column;">
                <label for="titleInput">메인 타이틀 텍스트</label>
                <input type="text" id="titleInput" value="MY SHOWTIME" placeholder="텍스트를 입력하세요">
            </div>
            
            <div style="display: flex; flex-direction: column;">
                <label for="subInput">서브 타이틀</label>
                <input type="text" id="subInput" value="A NETFLIX ORIGINAL" placeholder="서브 문구를 입력하세요">
            </div>

            <button id="downloadBtn">컴퓨터에 이미지로 저장하기</button>
        </div>

        <!-- 실시간 미리보기 및 캡처 영역 -->
        <div class="preview-box" id="captureArea">
            <h2 class="preview-title" id="previewTitle">MY SHOWTIME</h2>
            <div class="preview-subtitle" id="previewSubtitle">A NETFLIX ORIGINAL</div>
        </div>
    </div>

    <script>
        // 1. 사용자가 글자를 입력할 때마다 실시간으로 화면 바꾸기
        const titleInput = document.getElementById('titleInput');
        const subInput = document.getElementById('subInput');
        
        const previewTitle = document.getElementById('previewTitle');
        const previewSubtitle = document.getElementById('previewSubtitle');

        titleInput.addEventListener('input', (e) => {
            previewTitle.innerText = e.target.value;
        });

        subInput.addEventListener('input', (e) => {
            previewSubtitle.innerText = e.target.value;
        });

        // 2. [저장하기] 버튼을 누르면 해당 영역을 이미지 파일로 뽑아내기
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const target = document.getElementById('captureArea');
            
            // html2canvas 도구를 이용해 캡처 진행
            html2canvas(target, {
                useCORS: true, // 외부 이미지나 폰트가 꼬이지 않도록 설정
                scale: 2       // 더 선명한 고화질로 저장하기 위해 해상도 2배 업
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-custom-thumbnail.png'; // 저장될 파일 이름
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
