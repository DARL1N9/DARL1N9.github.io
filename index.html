<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소솜 간단 자료틀 메이커 - 다크 템플릿 버전</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        /* [1. 기본 웹 레이아웃 스타일] */
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background-color: #1a1a1a; /* 다크 테마에 맞춘 어두운 배경 */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #BED197; /* 지정해주신 연두 테마색 포인트 */
        }

        /* [2. 메인 시트 캔버스 (1000px * 563px 고정 및 원본 이미지 배경 이식)] */
        .capture-area {
            width: 1000px; height: 563px;
            background-image: url('[배포용] 얘 그려주세요 틀.jpg'); /* 원본 이미지를 배경으로 고정 */
            background-size: cover;
            background-position: center;
            position: relative;
            box-sizing: border-box;
            overflow: visible; /* 배지 탈출 허용 */
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* 공통 스타일: 이미지 업로드 상자 (투명하게 처리하여 배경 틀이 보이도록 세팅) */
        .image-box {
            position: absolute;
            cursor: move;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.03); /* 아주 미세한 가이드 음영 */
            transition: background 0.2s;
        }
        .image-box:hover {
            background-color: rgba(190, 209, 151, 0.08); /* 마우스 올리면 연두빛 하이라이트 */
        }
        .img-container {
            width: 100%; height: 100%;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }
        .image-box.placeholder .img-container::before {
            content: '클릭하여 업로드\A(드래그: 이동 / 휠: 줌)';
            white-space: pre-wrap;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #666666;
            width: 100%;
            text-align: center;
            z-index: 1;
        }
        .image-box input[type="file"] { display: none; }
        .image-box img { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            transform-origin: center center; 
            display: none; 
            z-index: 2; 
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 공통 스타일: 이미지 틀 위에 따로 추가할 텍스트 입력창 (틀 배경을 해치지 않게 투명 처리) */
        .transparent-input {
            background: transparent;
            border: none;
            color: #000000;
            font-family: 'Pretendard', sans-serif;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .transparent-input:focus {
            outline: 1px dashed #BED197;
        }
        
        .transparent-textarea {
            background: transparent;
            border: none;
            color: #000000;
            font-family: 'Pretendard', sans-serif;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            resize: none;
        }
        .transparent-textarea:focus {
            outline: 1px dashed #BED197;
        }

        /* ==================== 이미지 각 칸의 정확한 좌표 및 크기 매칭 ==================== */
        .main-profile-img { left: 355px; top: 35px; width: 280px; height: 342px; border: 1px solid #000; }
        .cloth-img-box { left: 660px; top: 35px; width: 295px; height: 375px; border: 1px solid #000; }
        
        .mini-box-container-sd { position: absolute; left: 355px; top: 395px; width: 134px; height: 110px; }
        .mini-box-container-sub { position: absolute; left: 501px; top: 395px; width: 134px; height: 110px; }
        .sd-img-box { width: 100%; height: 100%; border: 1px solid #000; }
        .sub-img-box { width: 100%; height: 100%; border: 1px solid #000; }

        /* 배지 레이아웃 (점선 원형 및 타원 텍스트 수정 영역) */
        .mini-badge-sd { position: absolute; top: -10px; left: 10px; background: #fff; border: 1px dashed #000; border-radius: 12px; font-size: 9px; padding: 2px 10px; font-weight: bold; z-index: 10; color: #000; }
        .mini-badge-sub { position: absolute; top: -10px; left: 10px; background: #fff; border: 1px dashed #000; border-radius: 12px; font-size: 9px; padding: 2px 6px; z-index: 10; display: inline-flex; }
        .mini-badge-sub-input { width: 75px; text-align: center; font-size: 9px; font-weight: bold; font-family: inherit; }
        .cloth-badge { position: absolute; top: -15px; left: -15px; background: #fff; border: 1px dashed #000; border-radius: 50%; width: 38px; height: 38px; text-align: center; line-height: 38px; font-size: 11px; font-weight: bold; z-index: 10; color: #000; }

        /* ==================== 이미지 오버레이 전용 텍스트 컴포넌트 좌표 배치 ==================== */
        
        /* 상단 네임 레이어 (한글 이름
